<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Анимации по начерталке</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=PT+Sans+Narrow:wght@400;700&family=PT+Mono&display=swap" rel="stylesheet">
<style>
/* Лист чертежа: рамка-штамп сверху, ниже — разделы курса сеткой карточек */
:root{
  --paper:#E9EDF1; --sheet:#F7F9FB; --ink:#1E2A38; --muted:#5A6878; --rule:#C9D2DB;
  --p2:#3B7BC4; --p1:#3E9A64; --red:#C8424A; --hi:#FCE9A8;
  --f-display:"PT Sans Narrow","PT Sans","Arial Narrow",Arial,sans-serif;
  --f-body:"PT Sans","Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"PT Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#141B23; --sheet:#1C2530; --ink:#DCE4EC; --muted:#93A1B0; --rule:#334150; --p2:#6AA3E3; --p1:#62BF88; --red:#E86A70; --hi:#5A4A1A; color-scheme:dark; }
}
:root[data-theme="dark"]{ --paper:#141B23; --sheet:#1C2530; --ink:#DCE4EC; --muted:#93A1B0; --rule:#334150; --p2:#6AA3E3; --p1:#62BF88; --red:#E86A70; --hi:#5A4A1A; color-scheme:dark; }
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 var(--f-body)}
.wrap{max-width:1080px;margin:0 auto;padding-block:20px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:22px}

/* штамп */
.stamp{border:2px solid var(--ink);background:var(--sheet);display:grid;grid-template-columns:1fr auto}
.stamp .name{padding:14px 16px;border-right:1px solid var(--ink);min-width:0}
.stamp h1{font:700 clamp(1.5rem,4vw,2.2rem)/1.1 var(--f-display);margin:0;text-wrap:balance}
.stamp .name p{margin:4px 0 0;color:var(--muted);font-size:.95rem}
.stamp .meta{display:grid;grid-template-rows:1fr 1fr;font:13px/1.2 var(--f-mono);min-width:7.5rem}
.stamp .meta div{padding:8px 12px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.stamp .meta div+div{border-top:1px solid var(--ink)}
.stamp .meta span{color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.stamp .meta b{font-size:18px;font-variant-numeric:tabular-nums}
@media (max-width:520px){ .stamp{grid-template-columns:1fr} .stamp .name{border-right:0;border-bottom:1px solid var(--ink)} .stamp .meta{grid-template-columns:1fr 1fr;grid-template-rows:none} .stamp .meta div+div{border-top:0;border-left:1px solid var(--ink)} }

/* поиск и фильтры */
.tools{display:flex;flex-direction:column;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:1.05rem;color:var(--ink);background:var(--sheet);border:1.5px solid var(--rule);border-radius:6px;padding:11px 44px 11px 40px}
.search input:focus{outline:none;border-color:var(--p2);box-shadow:0 0 0 3px color-mix(in srgb,var(--p2) 25%,transparent)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:12px var(--f-mono);color:var(--muted);border:1px solid var(--rule);border-radius:4px;padding:2px 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font:inherit;font-size:.9rem;color:var(--ink);background:transparent;border:1px solid var(--rule);border-radius:999px;padding:5px 12px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.chips button .n{color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
.chips button[aria-pressed="true"] .n{color:inherit;opacity:.7}
button:focus-visible,a:focus-visible{outline:2px solid var(--p2);outline-offset:2px}

/* разделы */
main{display:flex;flex-direction:column;gap:26px}
section{display:flex;flex-direction:column;gap:10px}
section h2{font:700 1.15rem/1.2 var(--f-display);margin:0;display:flex;align-items:baseline;gap:10px;letter-spacing:.01em}
section h2::after{content:"";flex:1;border-bottom:1px solid var(--rule);transform:translateY(-4px)}
section h2 small{font:13px var(--f-mono);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
@media (max-width:360px){ .grid{grid-template-columns:1fr} }

.card{display:grid;grid-template-columns:76px 1fr;gap:12px;background:var(--sheet);border:1px solid var(--rule);border-radius:8px;padding:12px;color:inherit;text-decoration:none;transition:border-color .15s, transform .15s}
.card:hover{border-color:var(--p2)}
@media (prefers-reduced-motion:no-preference){ .card:hover{transform:translateY(-1px)} }
.card .ico{width:76px;height:76px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink)}
.card .body{min-width:0;display:flex;flex-direction:column;gap:4px}
.card h3{font:700 1.05rem/1.2 var(--f-body);margin:0;text-wrap:balance}
.card p{margin:0;font-size:.9rem;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto;padding-top:4px}
.tags span{font:12px/1.4 var(--f-mono);color:var(--muted);border:1px solid var(--rule);border-radius:4px;padding:0 5px}
mark{background:var(--hi);color:inherit;border-radius:2px}

.empty{background:var(--sheet);border:1px dashed var(--rule);border-radius:8px;padding:20px;color:var(--muted);text-align:center}
.empty button{font:inherit;color:var(--p2);background:none;border:0;cursor:pointer;text-decoration:underline}
footer{color:var(--muted);font-size:.85rem;border-top:1px solid var(--rule);padding-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <header class="stamp">
    <div class="name">
      <h1>Начертательная геометрия и инженерная графика</h1>
      <p>3D-анимации к задачам: вращай модель, переключай шаги, складывай П₁ в эпюр</p>
    </div>
    <div class="meta">
      <div><span>Анимаций</span><b id="total">9</b></div>
      <div><span>Разделов</span><b id="sections">4</b></div>
    </div>
  </header>

  <div class="tools">
    <label class="search" for="q">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" placeholder="Поиск: конус, видимость, натуральная величина, П₃…" autocomplete="off" aria-label="Поиск по анимациям">
      <kbd>/</kbd>
    </label>
    <div class="chips" id="chips" role="group" aria-label="Раздел"></div>
  </div>

  <main id="list"></main>

  <footer>Каждая анимация открывается отдельной страницей; кнопка «← Каталог» в углу возвращает сюда. Нужен интернет: модели загружают three.js.</footer>
</div>

<script>
// ---------- каталог ----------
// icon — ключ схематичной картинки ниже; keys — синонимы для поиска (то, как это называют на паре)
const TOPICS = [
  {id:'surf', name:'Точки на поверхностях'},
  {id:'lines', name:'Прямые'},
  {id:'cross', name:'Пересечения'},
  {id:'draw', name:'Черчение'},
];
const ITEMS = [
  {t:'surf', href:'anim/sphere-points.html', icon:'sphere',
   title:'Сфера: проекции точек', desc:'Точки на экваторе, главном меридиане и в общем положении. Плоскость Σ ∥ П₁ и параллель.',
   tags:['сфера','параллель','Σ ∥ П₁'], keys:'шар экватор меридиан очерк видимость точка на поверхности'},
  {t:'surf', href:'anim/cone-points.html', icon:'cone',
   title:'Конус: проекции точки', desc:'Дана D₂ — найти D₁ двумя способами: параллелью и образующей.',
   tags:['конус','параллель','образующая'], keys:'точка на поверхности вершина основание видимость'},
  {t:'lines', href:'anim/two-lines.html', icon:'twolines',
   title:'Взаимное положение двух прямых', desc:'Скрещивающиеся, пересекающиеся, параллельные — как отличить по эпюру.',
   tags:['скрещивающиеся','конкурирующие точки'], keys:'параллельные пересекающиеся видимость линии связи'},
  {t:'lines', href:'anim/profile-line.html', icon:'profile',
   title:'Профильная прямая', desc:'Почему двух проекций мало и как помогает П₃. Ловушка с точкой C.',
   tags:['П₃','н.в.','α + β = 90°'], keys:'профильная плоскость натуральная величина углы наклона принадлежность точки прямой'},
  {t:'lines', href:'anim/right-triangle.html', icon:'triangle',
   title:'Метод прямоугольного треугольника', desc:'Почему гипотенуза равна натуральной величине отрезка. Углы α и β.',
   tags:['н.в. отрезка','Δz','Δy','α','β'], keys:'натуральная величина длина отрезка угол наклона к плоскости проекций'},
  {t:'cross', href:'anim/line-plane.html', icon:'plane',
   title:'Прямая и плоскость общего положения', desc:'Точка K = l ∩ ABC через вспомогательную проецирующую плоскость Γ.',
   tags:['Γ ⊥ П₁','точка встречи','видимость'], keys:'пересечение прямой с плоскостью треугольник конкурирующие точки посредник'},
  {t:'cross', href:'anim/line-pyramid.html', icon:'pyramid',
   title:'Прямая и пирамида', desc:'Сечение плоскостью Γ ⊥ П₂, точки входа и выхода M и N.',
   tags:['сечение','точки входа и выхода'], keys:'пересечение прямой с многогранником пирамида видимость фронтально-проецирующая'},
  {t:'cross', href:'anim/line-cylinder.html', icon:'cylinder',
   title:'Прямая и цилиндр', desc:'Цилиндр ⊥ П₁ — проецирующая поверхность, вспомогательная плоскость не нужна.',
   tags:['собирательная проекция','видимость'], keys:'пересечение прямой с поверхностью цилиндр проецирующий очерковая образующая'},
  {t:'draw', href:'anim/threads.html', icon:'thread',
   title:'Резьбовые соединения, вариант 4', desc:'Деталь с резьбой и линза в оправе: вид + разрез, полный разрез, разнесение.',
   tags:['резьба','разрез','сборка'], keys:'резьбовое соединение шестигранник оправа кольцо линза чертёж'},
];

// ---------- схематичные иконки (линии чертежа) ----------
const S = 'fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"';
const D = 'stroke-dasharray="3 2.5"';
const ICONS = {
  sphere:`<circle cx="38" cy="38" r="22" ${S}/><ellipse cx="38" cy="38" rx="22" ry="7" ${S} ${D}/><path d="M38 12v52M12 38h52" ${S} opacity=".45" ${D}/><circle cx="50" cy="43" r="2.6" fill="var(--red)"/>`,
  cone:`<path d="M38 12 L16 58 M38 12 L60 58" ${S}/><ellipse cx="38" cy="58" rx="22" ry="6" ${S}/><path d="M24 36h28" stroke="var(--p1)" stroke-width="1.6" fill="none"/><circle cx="32" cy="36" r="2.6" fill="var(--red)"/>`,
  twolines:`<path d="M12 60 L62 18" stroke="var(--red)" stroke-width="2" fill="none"/><path d="M12 24 L62 54" stroke="var(--p2)" stroke-width="2" fill="none"/><path d="M38 10v56" ${S} opacity=".5" ${D}/>`,
  profile:`<path d="M14 14v48h48" ${S}/><path d="M38 14v48" ${S} opacity=".45" ${D}/><path d="M24 22 L52 54" stroke="var(--red)" stroke-width="2" fill="none"/><circle cx="24" cy="22" r="2.4" fill="var(--red)"/><circle cx="52" cy="54" r="2.4" fill="var(--red)"/>`,
  triangle:`<path d="M14 58 H58 V22 Z" ${S}/><path d="M14 58 L58 22" stroke="var(--red)" stroke-width="2.2" fill="none"/><path d="M52 58v-6h6" ${S}/><path d="M26 58 A12 12 0 0 0 23.5 51" ${S}/>`,
  plane:`<path d="M12 50 L34 16 L64 40 Z" ${S}/><path d="M18 18 L60 62" stroke="var(--red)" stroke-width="2" fill="none"/><circle cx="37" cy="37" r="3" fill="var(--red)"/>`,
  pyramid:`<path d="M36 12 L14 56 L44 64 L62 50 Z M36 12 L44 64" ${S}/><path d="M14 56 L62 50" ${S} ${D}/><path d="M8 30 L68 46" stroke="var(--red)" stroke-width="2" fill="none"/>`,
  cylinder:`<ellipse cx="38" cy="18" rx="18" ry="6" ${S}/><path d="M20 18v40M56 18v40" ${S}/><path d="M20 58 A18 6 0 0 0 56 58" ${S}/><path d="M20 58 A18 6 0 0 1 56 58" ${S} ${D}/><path d="M8 52 L68 26" stroke="var(--red)" stroke-width="2" fill="none"/>`,
  thread:`<path d="M10 38h56" stroke="var(--red)" stroke-width="1.2" stroke-dasharray="8 3 2 3" fill="none"/><path d="M14 22h44M14 54h44M14 22v32M58 22v32" ${S}/><path d="M14 26h44M14 50h44" ${S} stroke-width="1" opacity=".6"/><path d="M14 54 L22 46 M22 54 L30 46 M30 54 L38 46 M38 54 L46 46 M46 54 L54 46" ${S} stroke-width="1" opacity=".7"/>`,
};

// ---------- поиск ----------
// нормализуем: регистр, ё→е, индексы П₁ → п1, «н.в.» → нв
const SUB = {'₀':'0','₁':'1','₂':'2','₃':'3','₄':'4'};
const norm = s => s.toLowerCase().replace(/ё/g,'е').replace(/[₀-₄]/g,c=>SUB[c]).replace(/[.,:;«»()]/g,' ').replace(/\s+/g,' ').trim();
ITEMS.forEach(it => it.hay = norm([it.title,it.desc,it.tags.join(' '),it.keys,it.tags.join(' ').replace(/\./g,'')].join(' ')));

const esc = s => s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// подсветка совпадений: ищем каждое слово запроса в исходном тексте без учёта регистра
function hl(text, words){
  let out = esc(text);
  words.forEach(w=>{ if(w.length<2) return;
    const re = new RegExp('('+w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/е/g,'[её]')+')','gi');
    out = out.replace(/(<[^>]*>)|([^<]+)/g,(m,tag,txt)=> tag ? tag : txt.replace(re,'<mark>$1</mark>'));
  });
  return out;
}

const qEl = document.getElementById('q'), list = document.getElementById('list'), chips = document.getElementById('chips');
let topic = 'all';
try{ topic = localStorage.getItem('eg-topic') || 'all'; }catch(e){}

function renderChips(matched){
  const cnt = id => matched.filter(i=>id==='all'||i.t===id).length;
  chips.innerHTML = [{id:'all',name:'Все'},...TOPICS].map(t=>
    `<button data-t="${t.id}" aria-pressed="${t.id===topic}">${t.name}<span class="n">${cnt(t.id)}</span></button>`).join('');
}
function render(){
  const raw = qEl.value, words = norm(raw).split(' ').filter(Boolean);
  const matched = ITEMS.filter(it => words.every(w => it.hay.includes(w)));
  renderChips(matched);
  const shown = matched.filter(it => topic==='all' || it.t===topic);
  const hw = raw.toLowerCase().split(/\s+/).filter(Boolean);
  if(!shown.length){
    list.innerHTML = `<div class="empty">Ничего не нашлось по запросу «${esc(raw)}»${topic!=='all'?' в этом разделе':''}. <button id="reset">Сбросить поиск</button></div>`;
    document.getElementById('reset').onclick = ()=>{ qEl.value=''; topic='all'; save(); render(); qEl.focus(); };
    return;
  }
  list.innerHTML = TOPICS.map(t=>{
    const its = shown.filter(i=>i.t===t.id); if(!its.length) return '';
    return `<section><h2>${t.name}<small>${its.length}</small></h2><div class="grid">${its.map(it=>`
      <a class="card" href="${it.href}">
        <svg class="ico" viewBox="0 0 76 76" aria-hidden="true">${ICONS[it.icon]}</svg>
        <div class="body">
          <h3>${hl(it.title,hw)}</h3>
          <p>${hl(it.desc,hw)}</p>
          <div class="tags">${it.tags.map(g=>`<span>${hl(g,hw)}</span>`).join('')}</div>
        </div>
      </a>`).join('')}</div></section>`;
  }).join('');
}
function save(){ try{ localStorage.setItem('eg-topic',topic); }catch(e){} }

chips.addEventListener('click', e=>{ const b=e.target.closest('button'); if(!b) return; topic=b.dataset.t; save(); render(); });
qEl.addEventListener('input', render);
qEl.addEventListener('keydown', e=>{
  if(e.key==='Enter'){ const a=list.querySelector('a.card'); if(a) location.href=a.href; }   // Enter — открыть первую найденную
  if(e.key==='Escape'){ qEl.value=''; render(); }
});
document.addEventListener('keydown', e=>{ if(e.key==='/' && document.activeElement!==qEl){ e.preventDefault(); qEl.focus(); } });
document.getElementById('total').textContent = ITEMS.length;
document.getElementById('sections').textContent = TOPICS.length;
render();
</script>
</body>
</html>
