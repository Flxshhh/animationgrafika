<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --paper:#E9EDF1; --panel:#F7F9FB; --ink:#1E2A38; --muted:#5A6878; --rule:#C9D2DB;
  --p2:#3B7BC4; --p1:#3E9A64; --p3:#B5651D; --accent:#D2484F;
  color-scheme: light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#141B23; --panel:#1C2530; --ink:#DCE4EC; --muted:#93A1B0; --rule:#334150; --p2:#6AA3E3; --p1:#62BF88; --p3:#E0954F; --accent:#E86A70; color-scheme: dark; }
}
:root[data-theme="dark"]{ --paper:#141B23; --panel:#1C2530; --ink:#DCE4EC; --muted:#93A1B0; --rule:#334150; --p2:#6AA3E3; --p1:#62BF88; --p3:#E0954F; --accent:#E86A70; color-scheme: dark; }
*{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:"PT Sans","Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{padding:12px 16px 4px}
h1{font-family:"PT Sans Narrow","PT Sans",Arial,sans-serif;font-weight:700;font-size:1.35rem;margin:0;letter-spacing:.01em}
header p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
#stage{position:relative;flex:1;min-height:200px}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.hint{position:absolute;left:16px;top:6px;font-size:.8rem;color:var(--muted);pointer-events:none}
.panel{background:var(--panel);border-top:1px solid var(--rule);padding:12px 16px 14px;max-height:50vh;overflow:auto}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
button{font:inherit;font-size:.92rem;color:var(--ink);background:transparent;border:1px solid var(--rule);border-radius:6px;padding:6px 12px;cursor:pointer}
button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--panel)}
button:focus-visible,input:focus-visible{outline:2px solid var(--p2);outline-offset:2px}
.steps button{border-style:dashed}
.steps button[aria-pressed="true"]{border-style:solid}
.slider{display:flex;align-items:center;gap:10px;width:100%}
.slider label{font-size:.92rem;white-space:nowrap;min-width:10.5em}
.slider input{flex:1}
#xIn{accent-color:var(--accent)} #yIn{accent-color:var(--p1)} #zIn{accent-color:var(--p2)} #fold{accent-color:var(--p1)}
#text{font-size:.92rem;line-height:1.5;max-width:72ch;margin:0 0 10px;border-left:3px solid var(--accent);padding-left:10px}
#calc{font-size:.92rem;line-height:1.6;margin:0 0 10px;padding:8px 10px;border:1px solid var(--rule);border-radius:6px;font-variant-numeric:tabular-nums}
</style>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=PT+Mono&display=swap" rel="stylesheet">

</head>
<body>
<a class="cat-back" href="../index.html" onclick="try{if(document.referrer&&new URL(document.referrer).pathname.replace(/index\.html$/,'')===new URL('../',location.href).pathname){history.back();return false}}catch(e){}" style="position:fixed;z-index:50;top:calc(8px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));font:600 14px/1 'PT Sans',Arial,sans-serif;padding:0 14px;min-height:44px;display:inline-flex;align-items:center;border-radius:6px;background:rgba(30,42,56,.86);color:#fff;text-decoration:none">← Каталог</a>
<header>
  <h1>Трёхкартинный комплексный чертёж</h1>
  <p>Точка A(x, y, z) и три её проекции: на П₁, П₂ и П₃</p>
</header>
<div id="stage">
  <canvas id="c"></canvas>
  <div class="hint">Вращайте пальцем или мышью, масштаб — колесом или щипком</div>
</div>
<div class="panel">
  <div class="row steps" id="steps">
    <button data-step="1" aria-pressed="true">1. Три плоскости</button>
    <button data-step="2" aria-pressed="false">2. Проецируем A</button>
    <button data-step="3" aria-pressed="false">3. Развёртка</button>
    <button data-step="4" aria-pressed="false">4. Эпюр</button>
  </div>
  <p id="text"></p>
  <div id="calc"></div>
  <div class="row slider">
    <label for="xIn">x (до П₃): <span id="xV"></span></label>
    <input id="xIn" type="range" min="5" max="55" value="32">
  </div>
  <div class="row slider">
    <label for="yIn">y (до П₂): <span id="yV"></span></label>
    <input id="yIn" type="range" min="5" max="45" value="22">
  </div>
  <div class="row slider">
    <label for="zIn">z (до П₁): <span id="zV"></span></label>
    <input id="zIn" type="range" min="5" max="45" value="30">
  </div>
  <div class="row slider">
    <label for="fold">Развёртка: <span id="foldV">0°</span></label>
    <input id="fold" type="range" min="0" max="90" value="0">
  </div>
  <div class="row">
    <label style="font-size:.9rem;display:flex;gap:6px;align-items:center"><input type="checkbox" id="t45"> Постоянная прямая (45°) вместо дуги</label>
  </div>
  <div class="row" id="views">
    <button data-view="iso" aria-pressed="true">Пространство</button>
    <button data-view="front" aria-pressed="false">Вид на П₂</button>
    <button data-view="side" aria-pressed="false">Вид на П₃</button>
    <button data-view="top" aria-pressed="false">Вид на П₁</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  // Монж: x — влево от O, y — к наблюдателю, z — вверх. three.js: X = −x, Y = z, Z = y
  const deg=Math.PI/180, SX=6.2, SY=5.2, SZ=5.2;
  const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const canvas=document.getElementById('c');
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(38,1,0.1,200);
  scene.add(new THREE.AmbientLight(0xffffff,0.85));

  const inkMats=[];
  const lm=(color,dashed,op=1,ink=false)=>{const m=dashed?new THREE.LineDashedMaterial({color,dashSize:0.13,gapSize:0.09,transparent:true,opacity:op}):new THREE.LineBasicMaterial({color,transparent:true,opacity:op}); if(ink) inkMats.push(m); return m;};
  function dline(n,mat){const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(new Array(n).fill(0).map(()=>new THREE.Vector3())),mat); l.frustumCulled=false; return l;}
  function setLine(l,pts){const p=l.geometry.attributes.position; for(let i=0;i<p.count;i++){const v=pts[Math.min(i,pts.length-1)]; p.setXYZ(i,v.x,v.y,v.z);} p.needsUpdate=true; if(l.material.isLineDashedMaterial) l.computeLineDistances();}
  const seg=(a,b,m)=>{const l=dline(2,m); setLine(l,[a,b]); return l;};
  const dot=(c,s=0.08)=>new THREE.Mesh(new THREE.SphereGeometry(s,16,12),new THREE.MeshBasicMaterial({color:c,transparent:true}));
  function label(text,color,scale=0.5){
    const c=document.createElement('canvas'); c.width=320; c.height=128; const g=c.getContext('2d');
    const tex=new THREE.CanvasTexture(c); tex.minFilter=THREE.LinearFilter;
    const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthTest:false,transparent:true})); s.scale.set(scale*2.5,scale,1); s.renderOrder=20;
    let last=''; s.setText=(t,col)=>{const k=t+col; if(k===last) return; last=k; g.clearRect(0,0,320,128); g.font='700 72px "PT Sans", Arial, sans-serif'; g.fillStyle=col; g.textAlign='center'; g.textBaseline='middle'; g.fillText(t,160,66); tex.needsUpdate=true;};
    s.setText(text,color); return s;
  }
  const arrow=c=>new THREE.Mesh(new THREE.ConeGeometry(0.07,0.25,12),new THREE.MeshBasicMaterial({color:c,transparent:true}));
  function setArrow(m,from,to,at=0.55){const d=new THREE.Vector3().subVectors(to,from); m.position.copy(from).addScaledVector(d,at); if(d.lengthSq()>1e-9) m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());}

  let INK,P1C,P2C,P3C; const AC='#D2484F';
  const p1g=new THREE.Group(), p2g=new THREE.Group(), p3g=new THREE.Group(); scene.add(p1g); scene.add(p2g); scene.add(p3g);
  const D={};
  const pl=(w,h,c)=>new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:0.1,side:THREE.DoubleSide,depthWrite:false}));
  const edges=(m,c)=>{const e=new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry),new THREE.LineBasicMaterial({color:c,transparent:true,opacity:0.6})); e.position.copy(m.position); e.rotation.copy(m.rotation); return e;};

  function build(){
    INK=css('--ink'); P1C=css('--p1'); P2C=css('--p2'); P3C=css('--p3');
    const p2=pl(SX,SZ,P2C); p2.position.set(-SX/2,SZ/2,0); p2g.add(p2); p2g.add(edges(p2,P2C));
    const l2=label('Π₂',P2C,0.55); l2.position.set(-SX+0.5,SZ-0.35,0.02); p2g.add(l2);
    const p1=pl(SX,SY,P1C); p1.rotation.x=-Math.PI/2; p1.position.set(-SX/2,0,SY/2); p1g.add(p1); p1g.add(edges(p1,P1C));
    const l1=label('Π₁',P1C,0.55); l1.position.set(-SX+0.5,0.02,SY-0.35); p1g.add(l1);
    const p3=pl(SY,SZ,P3C); p3.rotation.y=Math.PI/2; p3.position.set(0,SZ/2,SY/2); p3g.add(p3); p3g.add(edges(p3,P3C));
    const l3=label('Π₃',P3C,0.55); l3.position.set(0.02,SZ-0.35,SY-0.5); p3g.add(l3);
    // оси
    scene.add(seg(new THREE.Vector3(-SX-0.3,0,0),new THREE.Vector3(0,0,0),lm(INK,false,1,true)));
    scene.add(seg(new THREE.Vector3(0,0,0),new THREE.Vector3(0,SZ+0.3,0),lm(INK,false,1,true)));
    p1g.add(seg(new THREE.Vector3(0,0,0),new THREE.Vector3(0,0,SY+0.3),lm(INK,false,1,true)));
    p3g.add(seg(new THREE.Vector3(0,0,0),new THREE.Vector3(0,0,SY+0.3),lm(INK,false,1,true)));
    const t=(s,c,p,g)=>{const l=label(s,c,0.42); l.position.copy(p); (g||scene).add(l);};
    t('x₁₂',INK,new THREE.Vector3(-SX-0.7,-0.15,0)); t('z₂₃',INK,new THREE.Vector3(0.45,SZ+0.3,0)); t('O',INK,new THREE.Vector3(0.3,-0.3,0.05));
    t('y₁₃',INK,new THREE.Vector3(-0.45,0.02,SY+0.35),p1g); t('y₁₃',INK,new THREE.Vector3(0.02,0.35,SY+0.45),p3g);

    // точка, проекции, лучи
    D.A=dot(AC,0.1); scene.add(D.A); D.Al=label('A',AC,0.5); scene.add(D.Al);
    D.A1=dot(AC,0.08); p1g.add(D.A1); D.A1l=label('A₁',AC,0.42); p1g.add(D.A1l);
    D.A2=dot(AC,0.08); p2g.add(D.A2); D.A2l=label('A₂',AC,0.42); p2g.add(D.A2l);
    D.A3=dot(AC,0.08); p3g.add(D.A3); D.A3l=label('A₃',AC,0.42); p3g.add(D.A3l);
    D.ray1=dline(2,lm(P1C,false,0.9)); D.ray2=dline(2,lm(P2C,false,0.9)); D.ray3=dline(2,lm(P3C,false,0.9));
    D.ar1=arrow(P1C); D.ar2=arrow(P2C); D.ar3=arrow(P3C);
    [D.ray1,D.ray2,D.ray3,D.ar1,D.ar2,D.ar3].forEach(o=>scene.add(o));
    // линии связи (соединяют проекции через оси)
    D.k=[]; for(let i=0;i<6;i++){const l=dline(2,lm(INK,false,0.75,true)); scene.add(l); D.k.push(l);}
    D.arc=dline(25,lm(INK,true,0.7,true)); scene.add(D.arc);
    D.c45=dline(2,lm(INK,false,0.6,true)); scene.add(D.c45);
    // точки на осях
    D.ax=dot(INK,0.05); scene.add(D.ax); D.az=dot(INK,0.05); scene.add(D.az);
    D.ay1=new THREE.Object3D(); p1g.add(D.ay1); D.ay3=new THREE.Object3D(); p3g.add(D.ay3);
    // размеры
    D.lx=label('x',AC,0.4); scene.add(D.lx);
    D.ly1=label('y',P1C,0.4); p1g.add(D.ly1); D.ly3=label('y',P3C,0.4); p3g.add(D.ly3);
    D.lz=label('z',P2C,0.4); p2g.add(D.lz);
  }

  const st={step:1,x:3.2,y:2.2,z:3.0,use45:false};
  const cur={th:-0.6,ph:1.1,r:18,t:[-1.6,1.8,1.8],fold:0}, tgt={...cur,t:[...cur.t]};
  const w1=new THREE.Vector3(), w3=new THREE.Vector3(), y1=new THREE.Vector3(), y3=new THREE.Vector3();

  function update(){
    const {x,y,z}=st, show=st.step>=2;
    p1g.rotation.x=cur.fold*deg; p3g.rotation.y=cur.fold*deg;
    p1g.updateMatrixWorld(true); p3g.updateMatrixWorld(true);
    const A=new THREE.Vector3(-x,z,y);
    D.A1.position.set(-x,0.02,y); D.A1l.position.set(-x-0.4,0.03,y+0.25);
    D.A2.position.set(-x,z,0.02); D.A2l.position.set(-x-0.4,z+0.25,0.03);
    D.A3.position.set(0.02,z,y);  D.A3l.position.set(0.03,z+0.25,y+0.35);
    D.ay1.position.set(0,0.02,y); D.ay3.position.set(0.02,0,y);
    D.A1.getWorldPosition(w1); D.A3.getWorldPosition(w3); D.ay1.getWorldPosition(y1); D.ay3.getWorldPosition(y3);
    const A2=D.A2.position, Ax=new THREE.Vector3(-x,0,0), Az=new THREE.Vector3(0,z,0);
    const fade=Math.max(0,1-cur.fold/50);
    const all=[D.A,D.Al,D.A1,D.A1l,D.A2,D.A2l,D.A3,D.A3l,D.ray1,D.ray2,D.ray3,D.ar1,D.ar2,D.ar3,...D.k,D.ax,D.az,D.lx,D.ly1,D.ly3,D.lz,D.arc,D.c45];
    all.forEach(o=>o.visible=show);
    [D.A,D.Al,D.ray1,D.ray2,D.ray3,D.ar1,D.ar2,D.ar3].forEach(o=>o.material.opacity=fade);
    D.A.position.copy(A); D.Al.position.copy(A).add(new THREE.Vector3(0.3,0.3,0));
    setLine(D.ray1,[A,w1]); setArrow(D.ar1,A,w1);
    setLine(D.ray2,[A,A2]); setArrow(D.ar2,A,A2);
    setLine(D.ray3,[A,w3]); setArrow(D.ar3,A,w3);
    D.ax.position.copy(Ax); D.az.position.copy(Az);
    // линии связи: A₂–Aₓ–A₁ (вертикаль на эпюре), A₂–A_z–A₃ (горизонталь), A₁–y–дуга–y–A₃
    setLine(D.k[0],[A2,Ax]); setLine(D.k[1],[Ax,w1]);
    setLine(D.k[2],[A2,Az]); setLine(D.k[3],[Az,w3]);
    setLine(D.k[4],[w1,y1]);
    // перенос y: дуга с центром O или постоянная прямая под 45°
    if(st.use45 && cur.fold>89){
      const corner=new THREE.Vector3(y,-y,0);         // на эпюре: точка пересечения горизонтали из A₁ с прямой 45°
      setLine(D.k[4],[w1,corner]); setLine(D.k[5],[corner,w3]);
      setLine(D.c45,[new THREE.Vector3(0,0,0),new THREE.Vector3(SY,-SY,0)]); D.c45.visible=show; D.arc.visible=false;
    } else {
      setLine(D.k[5],[y3,w3]); D.c45.visible=false;
      const a=y1.clone(), b=y3.clone(), r=a.length(), ang=a.angleTo(b), n=new THREE.Vector3().crossVectors(a,b), pts=[];
      if(ang<1e-3||n.lengthSq()<1e-9) for(let i=0;i<=24;i++) pts.push(a.clone());
      else { n.normalize(); const an=a.clone().normalize(); for(let i=0;i<=24;i++) pts.push(an.clone().applyAxisAngle(n,ang*i/24).multiplyScalar(r)); }
      setLine(D.arc,pts);
    }
    // подписи координат
    D.lx.position.set(-x/2,-0.3,0.05);
    D.lz.position.set(-x+0.35,z/2,0.03);
    D.ly1.position.set(-x+0.35,0.03,y/2);
    D.ly3.position.set(0.03,z-0.3,y/2);
  }

  const TEXT={
    1:'Добавляем третью плоскость — профильную П₃, перпендикулярную П₁ и П₂. Три плоскости пересекаются по осям x₁₂, y₁₃, z₂₃, а оси сходятся в начале координат O. Положение точки задают три координаты: A(x, y, z) — расстояния до П₃, П₂ и П₁ соответственно.',
    2:'Проецируем A на все три плоскости. Каждая проекция несёт две координаты: A₁(x, y), A₂(x, z), A₃(y, z). Длины проецирующих лучей и есть координаты: AA₁ = z, AA₂ = y, AA₃ = x. Вместе с отрезками до осей они образуют «коробку» — прямоугольный параллелепипед координат.',
    3:'Развёртка: П₁ поворачиваем вниз вокруг оси x, П₃ — вправо вокруг оси z. Ось y при этом «раздваивается»: одна её часть уходит с П₁ вниз, другая — с П₃ вправо. Поэтому на эпюре y₁₃ подписана дважды.',
    4:'Трёхкартинный чертёж. A₁A₂ ⟂ x₁₂ — вертикальная линия связи, A₂A₃ ⟂ z₂₃ — горизонтальная. Координату y переносим с П₁ на П₃ дугой с центром O (или через постоянную прямую под 45°). Любые две проекции однозначно задают третью: z для A₃ берём с A₂, y — с A₁.',
  };
  const calc=()=>`A(${st.x.toFixed(1)}; ${st.y.toFixed(1)}; ${st.z.toFixed(1)}) &nbsp;→&nbsp; A₁(x; y) = (${st.x.toFixed(1)}; ${st.y.toFixed(1)}), &nbsp;A₂(x; z) = (${st.x.toFixed(1)}; ${st.z.toFixed(1)}), &nbsp;A₃(y; z) = (${st.y.toFixed(1)}; ${st.z.toFixed(1)})<br>Каждая координата встречается ровно в двух проекциях — поэтому третья проекция строится по двум.`;

  const VIEWS={iso:{th:-0.6,ph:1.1,r:18,t:[-1.6,1.8,1.8]}, front:{th:0,ph:Math.PI/2,r:21,t:[0,0,0]}, side:{th:-Math.PI/2,ph:Math.PI/2,r:15,t:[0,2.4,2.4]}, top:{th:0,ph:0.001,r:15,t:[-2.4,0,2.4]}};
  function placeCamera(){const s=Math.sin(cur.ph); camera.position.set(cur.t[0]+cur.r*s*Math.sin(cur.th),cur.t[1]+cur.r*Math.cos(cur.ph),cur.t[2]+cur.r*s*Math.cos(cur.th)); camera.up.set(0,1,0); if(cur.ph<0.01) camera.up.set(0,0,-1); camera.lookAt(...cur.t);}
  const pointers=new Map(); let pinch0=0,r0=0;
  canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY}); if(pointers.size===2){const [a,b]=[...pointers.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);r0=tgt.r;}});
  canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return; const pr=pointers.get(e.pointerId),dx=e.clientX-pr.x,dy=e.clientY-pr.y; pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pointers.size===1){tgt.th-=dx*0.008;tgt.ph=Math.min(Math.PI-0.05,Math.max(0.001,tgt.ph-dy*0.008));cur.th=tgt.th;cur.ph=tgt.ph;markView(null);}
    else if(pointers.size===2&&pinch0>0){const [a,b]=[...pointers.values()];tgt.r=Math.min(45,Math.max(6,r0*pinch0/Math.hypot(a.x-b.x,a.y-b.y)));}});
  const up=e=>{pointers.delete(e.pointerId); if(pointers.size<2)pinch0=0;};
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);
  canvas.addEventListener('wheel',e=>{e.preventDefault();tgt.r=Math.min(45,Math.max(6,tgt.r*(1+Math.sign(e.deltaY)*0.08)));},{passive:false});
  function markView(n){document.querySelectorAll('#views button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===n)));}
  function goView(n){const v=VIEWS[n]; tgt.th=v.th;tgt.ph=v.ph;tgt.r=v.r;tgt.t=[...v.t]; while(cur.th-tgt.th>Math.PI)cur.th-=2*Math.PI; while(tgt.th-cur.th>Math.PI)cur.th+=2*Math.PI; markView(n);}
  document.querySelectorAll('#views button').forEach(b=>b.addEventListener('click',()=>goView(b.dataset.view)));
  function resize(){const s=document.getElementById('stage');renderer.setSize(s.clientWidth,s.clientHeight,false);camera.aspect=s.clientWidth/s.clientHeight;camera.updateProjectionMatrix();}
  new ResizeObserver(resize).observe(document.getElementById('stage'));

  function start(){
    build();
    const T=id=>document.getElementById(id);
    const setFold=v=>{tgt.fold=v; T('fold').value=v; T('foldV').textContent=v+'°';};
    const ui=()=>{
      document.querySelectorAll('#steps button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===st.step)));
      T('text').textContent=TEXT[st.step]; T('calc').innerHTML=calc();
      T('xV').textContent=st.x.toFixed(1); T('yV').textContent=st.y.toFixed(1); T('zV').textContent=st.z.toFixed(1);
    };
    document.querySelectorAll('#steps button').forEach(b=>b.addEventListener('click',()=>{
      st.step=+b.dataset.step;
      if(st.step<=2){ setFold(0); goView('iso'); }
      if(st.step===3){ setFold(90); goView('iso'); }
      if(st.step===4){ setFold(90); goView('front'); }
      ui();}));
    [['xIn','x'],['yIn','y'],['zIn','z']].forEach(([id,k])=>T(id).addEventListener('input',()=>{st[k]=+T(id).value/10; if(st.step<2) st.step=2; ui();}));
    T('fold').addEventListener('input',()=>{setFold(+T('fold').value); if(st.step<2) st.step=2; ui();});
    T('t45').addEventListener('change',()=>{st.use45=T('t45').checked;});
    ui();
    const mq=matchMedia('(prefers-color-scheme: dark)'); mq.addEventListener&&mq.addEventListener('change',()=>{const c=css('--ink');inkMats.forEach(m=>m.color.set(c));});
    const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
    (function frame(){
      const k=reduce?1:0.1;
      cur.th+=(tgt.th-cur.th)*k;cur.ph+=(tgt.ph-cur.ph)*k;cur.r+=(tgt.r-cur.r)*k; for(let i=0;i<3;i++)cur.t[i]+=(tgt.t[i]-cur.t[i])*k;
      const df=tgt.fold-cur.fold; cur.fold += reduce ? df : Math.sign(df)*Math.min(Math.abs(df),0.9);
      update(); placeCamera(); renderer.render(scene,camera); requestAnimationFrame(frame);
    })();
    resize();
  }
  const ready=document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve();
  Promise.race([ready,new Promise(r=>setTimeout(r,1500))]).then(start);
})();
</script>
