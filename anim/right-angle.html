<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=PT+Sans+Narrow:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E9EDF1; --panel:#F7F9FB; --ink:#1E2A38; --muted:#5A6878; --rule:#C9D2DB;
  --p2:#3B7BC4; --p1:#3E9A64;
  color-scheme: light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#141B23; --panel:#1C2530; --ink:#DCE4EC; --muted:#93A1B0; --rule:#334150; --p2:#6AA3E3; --p1:#62BF88; color-scheme: dark; }
}
:root[data-theme="dark"]{ --paper:#141B23; --panel:#1C2530; --ink:#DCE4EC; --muted:#93A1B0; --rule:#334150; --p2:#6AA3E3; --p1:#62BF88; color-scheme: dark; }
*{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:"PT Sans","Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{padding:12px 16px 4px}
h1{font-family:"PT Sans Narrow","PT Sans",Arial,sans-serif;font-weight:700;font-size:1.35rem;margin:0;letter-spacing:.01em}
header p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
#stage{position:relative;flex:1;min-height:200px}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.hint{position:absolute;left:16px;top:6px;font-size:.8rem;color:var(--muted);pointer-events:none}
.panel{background:var(--panel);border-top:1px solid var(--rule);padding:12px 16px 14px;max-height:48vh;overflow:auto}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
button{font:inherit;font-size:.92rem;color:var(--ink);background:transparent;border:1px solid var(--rule);border-radius:6px;padding:6px 12px;cursor:pointer}
button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--panel)}
button:focus-visible,input:focus-visible{outline:2px solid var(--p2);outline-offset:2px}
.steps button{border-style:dashed}
.steps button[aria-pressed="true"]{border-style:solid}
.fold{display:flex;align-items:center;gap:10px;width:100%}
.fold label{font-size:.92rem;white-space:nowrap}
.fold input{flex:1;accent-color:var(--p1)}
.toggles label{font-size:.9rem;display:flex;gap:6px;align-items:center;margin-right:10px}
#calc{font-size:.92rem;line-height:1.6;margin:0 0 10px;padding:8px 10px;border:1px solid var(--rule);border-radius:6px;font-variant-numeric:tabular-nums}
#tilt{accent-color:#C08A1A} #phi{accent-color:#8A5CC8}
#stepText{font-size:.92rem;line-height:1.5;max-width:70ch;margin:0;border-left:3px solid var(--p2);padding-left:10px}
</style>
</head>
<body>
<a class="cat-back" href="../index.html" onclick="try{if(document.referrer&&new URL(document.referrer).pathname.replace(/index\.html$/,'')===new URL('../',location.href).pathname){history.back();return false}}catch(e){}" style="position:fixed;z-index:50;top:calc(8px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));font:600 14px/1 'PT Sans',Arial,sans-serif;padding:0 14px;min-height:44px;display:inline-flex;align-items:center;border-radius:6px;background:rgba(30,42,56,.86);color:#fff;text-decoration:none">← Каталог</a>
<header>
  <h1>Проецирование прямого угла</h1>
  <p>Когда прямой угол ABC проецируется в прямой, а когда искажается</p>
</header>
<div id="stage">
  <canvas id="c"></canvas>
  <div class="hint">Вращайте пальцем или мышью, масштаб — колесом или щипком</div>
</div>
<div class="panel">
  <div class="row steps" id="steps">
    <button data-step="1" aria-pressed="true">1. Общее положение</button>
    <button data-step="2" aria-pressed="false">2. BC ∥ П₁</button>
    <button data-step="3" aria-pressed="false">3. Почему так</button>
    <button data-step="4" aria-pressed="false">4. BC ∥ П₂</button>
  </div>
  <p id="stepText"></p>
  <div id="calc"></div>
  <div class="row fold">
    <label for="tilt"><span id="tiltName">Наклон BC к П₁</span>: <span id="tiltVal">0°</span></label>
    <input id="tilt" type="range" min="0" max="60" value="25">
  </div>
  <div class="row fold">
    <label for="phi">Поворот BA вокруг BC: <span id="phiVal">0°</span></label>
    <input id="phi" type="range" min="-75" max="75" value="40">
  </div>
  <div class="row">
    <button id="play" aria-pressed="false">▶ Вращать BA вокруг BC</button>
  </div>
  <div class="row" id="views" style="margin-top:10px">
    <button data-view="iso" aria-pressed="true">Пространство</button>
    <button data-view="front" aria-pressed="false">Вид на П₂</button>
    <button data-view="top" aria-pressed="false">Вид на П₁</button>
    <button data-view="epure" aria-pressed="false">Эпюр</button>
  </div>
  <div class="row fold">
    <label for="fold">Поворот П₁: <span id="foldVal">0°</span></label>
    <input id="fold" type="range" min="0" max="90" value="0">
  </div>
  <div class="row toggles">
    <label><input type="checkbox" id="tSpace" checked> Объекты в пространстве</label>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  // ---------- Монж: x; y — к наблюдателю; z — вверх ----------
  const V=(x,y,z)=>({x,y,z});
  const add=(a,b)=>V(a.x+b.x,a.y+b.y,a.z+b.z), mul=(a,k)=>V(a.x*k,a.y*k,a.z*k);
  const dotp=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z, cross=(a,b)=>V(a.y*b.z-a.z*b.y,a.z*b.x-a.x*b.z,a.x*b.y-a.y*b.x);
  const len=a=>Math.sqrt(dotp(a,a)), unit=a=>mul(a,1/len(a));
  const deg=Math.PI/180, PSI=20*deg;          // азимут стороны BC
  const B=V(-0.6,2.7,2.5), LC=2.6, LA=2.0;

  // прямой угол ABC: c — направление BC, a — направление BA (a ⟂ c), φ — поворот BA вокруг BC
  // mode 'h': θ — наклон BC к П₁; mode 'f': θ — наклон BC к П₂
  function geom(mode,th,ph){
    const c = mode==='h' ? V(Math.cos(th)*Math.cos(PSI), Math.cos(th)*Math.sin(PSI), Math.sin(th))
                         : V(Math.cos(th)*Math.cos(PSI), Math.sin(th), Math.cos(th)*Math.sin(PSI));
    const n1 = unit(mode==='h' ? cross(V(0,0,1),c) : cross(V(0,1,0),c));   // ⟂ c, лежит в плоскости ∥ П₁ (или ∥ П₂)
    const n2 = unit(cross(c,n1));
    const a = add(mul(n1,Math.cos(ph)), mul(n2,Math.sin(ph)));
    const A=add(B,mul(a,LA)), C=add(B,mul(c,LC));
    const ang=(u,v)=>{const d=(u[0]*v[0]+u[1]*v[1])/(Math.hypot(...u)*Math.hypot(...v)); return Math.acos(Math.max(-1,Math.min(1,d)))/deg;};
    return {A,C,c,a, ang1:ang([a.x,a.y],[c.x,c.y]), ang2:ang([a.x,a.z],[c.x,c.z])};
  }

  const PLANE_V=5.6, PLANE_H=6.0, HALF_X=3.6;
  const W=p=>new THREE.Vector3(p.x,p.z,p.y);
  const on2=(p,e=0.02)=>new THREE.Vector3(p.x,p.z,e);
  const on1=(p,e=0.02)=>new THREE.Vector3(p.x,e,p.y);
  const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  const canvas=document.getElementById('c');
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(38,1,0.1,200);
  scene.add(new THREE.AmbientLight(0xffffff,0.8));

  const inkMats=[];
  function lineMat(color,dashed,opacity=1,isInk=false){
    const m=dashed?new THREE.LineDashedMaterial({color,dashSize:0.13,gapSize:0.09,transparent:true,opacity}):new THREE.LineBasicMaterial({color,transparent:true,opacity});
    if(isInk) inkMats.push(m); return m;
  }
  // линия с n вершинами, обновляемая на лету
  function dline(n,mat){const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(new Array(n).fill(0).map(()=>new THREE.Vector3())),mat); l.frustumCulled=false; return l;}
  function setLine(l,pts){const p=l.geometry.attributes.position; pts.forEach((v,i)=>p.setXYZ(i,v.x,v.y,v.z)); p.needsUpdate=true; if(l.material.isLineDashedMaterial) l.computeLineDistances();}
  const seg=(a,b,mat)=>{const l=dline(2,mat); setLine(l,[a,b]); return l;};
  function dtube(color,rad=0.04){return new THREE.Mesh(new THREE.CylinderGeometry(rad,rad,1,10),new THREE.MeshBasicMaterial({color}));}
  function setTube(m,a,b){const d=new THREE.Vector3().subVectors(b,a); m.scale.set(1,d.length(),1); m.position.copy(a).addScaledVector(d,0.5); m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());}
  function dquad(color,op){const g=new THREE.BufferGeometry().setFromPoints([0,0,0,0].map(()=>new THREE.Vector3())); g.setIndex([0,1,2,0,2,3]);
    const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color,transparent:true,opacity:op,side:THREE.DoubleSide,depthWrite:false})); m.frustumCulled=false; return m;}
  function setQuad(m,pts){const p=m.geometry.attributes.position; pts.forEach((v,i)=>p.setXYZ(i,v.x,v.y,v.z)); p.needsUpdate=true; m.geometry.computeBoundingSphere();}
  const dot=(color,size=0.075)=>new THREE.Mesh(new THREE.SphereGeometry(size,16,12),new THREE.MeshBasicMaterial({color}));
  // подпись с изменяемым текстом
  function label(text,color,scale=0.5){
    const c=document.createElement('canvas'); c.width=320; c.height=128;
    const g=c.getContext('2d'); const tex=new THREE.CanvasTexture(c); tex.minFilter=THREE.LinearFilter;
    const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthTest:false,transparent:true})); s.scale.set(scale*2.5,scale,1); s.renderOrder=20;
    let last='';
    s.setText=(t,col)=>{ const key=t+'|'+col; if(key===last) return; last=key;
      g.clearRect(0,0,320,128); g.font='700 72px "PT Sans", Arial, sans-serif'; g.fillStyle=col; g.textAlign='center'; g.textBaseline='middle'; g.fillText(t,160,66); tex.needsUpdate=true; };
    s.setText(text,color); return s;
  }
  // значок прямого угла / дуга угла в вершине O (направления на P и Q)
  function cornerPts(O,P,Q,r,right){
    const a=new THREE.Vector3().subVectors(P,O).normalize(), b=new THREE.Vector3().subVectors(Q,O).normalize();
    if(right){ const a2=a.clone().multiplyScalar(r), b2=b.clone().multiplyScalar(r);
      const pts=[O.clone().add(a2),O.clone().add(a2).add(b2),O.clone().add(b2)]; while(pts.length<25) pts.push(pts[2].clone()); return pts; }
    const ang=a.angleTo(b), n=new THREE.Vector3().crossVectors(a,b).normalize(), pts=[];
    for(let i=0;i<=24;i++) pts.push(a.clone().applyAxisAngle(n,ang*i/24).multiplyScalar(r).add(O));
    return pts;
  }

  let INK,P1C,P2C;
  const COL={A:'#D2484F', C:'#3F5FBF', B:'#1E2A38', ok:'#2E8B57', bad:'#D2484F', S:'#C08A1A'};
  const p2g=new THREE.Group(); scene.add(p2g);
  const p1g=new THREE.Group(); scene.add(p1g);
  const sp3=new THREE.Group(); scene.add(sp3);       // объекты в пространстве
  const kk=new THREE.Group(); scene.add(kk);         // линии связи
  const why=new THREE.Group(); scene.add(why);       // шаг 3: проецирующая плоскость

  function buildPlanes(){
    INK=css('--ink'); P1C=css('--p1'); P2C=css('--p2'); COL.B=INK;
    const p2=new THREE.Mesh(new THREE.PlaneGeometry(HALF_X*2,PLANE_V),new THREE.MeshBasicMaterial({color:P2C,transparent:true,opacity:0.08,side:THREE.DoubleSide,depthWrite:false}));
    p2.position.set(0,PLANE_V/2,0); p2g.add(p2);
    const e2=new THREE.LineSegments(new THREE.EdgesGeometry(p2.geometry),new THREE.LineBasicMaterial({color:P2C,transparent:true,opacity:0.6})); e2.position.copy(p2.position); p2g.add(e2);
    const l2=label('Π₂',P2C,0.55); l2.position.set(-HALF_X+0.5,PLANE_V-0.35,0.02); p2g.add(l2);
    const p1=new THREE.Mesh(new THREE.PlaneGeometry(HALF_X*2,PLANE_H),new THREE.MeshBasicMaterial({color:P1C,transparent:true,opacity:0.08,side:THREE.DoubleSide,depthWrite:false}));
    p1.rotation.x=-Math.PI/2; p1.position.set(0,0,PLANE_H/2); p1g.add(p1);
    const e1=new THREE.LineSegments(new THREE.EdgesGeometry(p1.geometry),new THREE.LineBasicMaterial({color:P1C,transparent:true,opacity:0.6})); e1.rotation.copy(p1.rotation); e1.position.copy(p1.position); p1g.add(e1);
    const l1=label('Π₁',P1C,0.55); l1.position.set(-HALF_X+0.5,0.02,PLANE_H-0.35); p1g.add(l1);
    scene.add(seg(new THREE.Vector3(-HALF_X,0,0),new THREE.Vector3(HALF_X,0,0),lineMat(INK,false,1,true)));
    const lx=label('x₁₂',INK,0.42); lx.position.set(-HALF_X-0.4,0,0); scene.add(lx);
  }

  // ---------- динамические объекты ----------
  const O={};
  function buildDynamic(){
    O.tA=dtube(COL.A); O.tC=dtube(COL.C); sp3.add(O.tA); sp3.add(O.tC);
    O.mark3=dline(25,lineMat(INK,false,1,true)); sp3.add(O.mark3);
    O.pts={};
    [['A',COL.A],['B',INK],['C',COL.C]].forEach(([n,c])=>{
      const o={};
      o.m=dot(c,0.09); sp3.add(o.m); o.l=label(n,c,0.45); sp3.add(o.l);
      o.m2=dot(c,0.075); p2g.add(o.m2); o.l2=label(n+'₂',c,0.38); p2g.add(o.l2);
      o.m1=dot(c,0.075); p1g.add(o.m1); o.l1=label(n+'₁',c,0.38); p1g.add(o.l1);
      o.L2=dline(2,lineMat(P2C,true,0.6)); sp3.add(o.L2);
      o.L1=dline(2,lineMat(P1C,true,0.6)); sp3.add(o.L1);
      o.k2=dline(2,lineMat(INK,false,0.4,true)); kk.add(o.k2);
      o.k1=dline(2,lineMat(INK,false,0.4,true)); kk.add(o.k1);
      O.pts[n]=o;
    });
    // проекции сторон
    O.a1=dline(2,lineMat(COL.A,false,1)); O.c1=dline(2,lineMat(COL.C,false,1)); p1g.add(O.a1); p1g.add(O.c1);
    O.a2=dline(2,lineMat(COL.A,false,1)); O.c2=dline(2,lineMat(COL.C,false,1)); p2g.add(O.a2); p2g.add(O.c2);
    O.mk1=dline(25,new THREE.LineBasicMaterial({color:COL.ok})); p1g.add(O.mk1);
    O.mk2=dline(25,new THREE.LineBasicMaterial({color:COL.ok})); p2g.add(O.mk2);
    O.v1=label('90°',COL.ok,0.4); p1g.add(O.v1);
    O.v2=label('90°',COL.ok,0.4); p2g.add(O.v2);
    // шаг 3: проецирующая плоскость стороны BA и прямые углы BC ⟂ её
    O.q=dquad(COL.S,0.18); why.add(O.q);
    O.qe=dline(5,lineMat(COL.S,false,0.9)); why.add(O.qe);
    O.qm1=dline(25,lineMat(COL.S,false,1)); why.add(O.qm1);
    O.qm2=dline(25,lineMat(COL.S,false,1)); why.add(O.qm2);
    O.ql=label('Σ ⊃ BA',COL.S,0.4); why.add(O.ql);
  }

  let G=null;
  function update(mode,th,ph){
    G=geom(mode,th*deg,ph*deg);
    const P={A:G.A,B:B,C:G.C};
    setTube(O.tA,W(B),W(G.A)); setTube(O.tC,W(B),W(G.C));
    setLine(O.mark3,cornerPts(W(B),W(G.A),W(G.C),0.32,true));
    const off={A:[-0.3,0.25],B:[-0.35,-0.25],C:[0.3,0.25]};
    for(const n in P){ const o=O.pts[n], p=P[n];
      o.w=W(p); o.m.position.copy(o.w); o.l.position.copy(o.w).add(new THREE.Vector3(off[n][0],off[n][1],0));
      o.m2.position.copy(on2(p,0.03)); o.l2.position.copy(on2(p,0.035)).add(new THREE.Vector3(off[n][0],off[n][1],0));
      o.m1.position.copy(on1(p,0.03)); o.l1.position.copy(on1(p,0.035)).add(new THREE.Vector3(off[n][0],0,-off[n][1]));
      setLine(o.L2,[o.w,on2(p,0.03)]); o.xa=new THREE.Vector3(p.x,0,0); setLine(o.k2,[on2(p,0.03),o.xa]);
    }
    setLine(O.a1,[on1(B,0.012),on1(G.A,0.012)]); setLine(O.c1,[on1(B,0.012),on1(G.C,0.012)]);
    setLine(O.a2,[on2(B,0.012),on2(G.A,0.012)]); setLine(O.c2,[on2(B,0.012),on2(G.C,0.012)]);
    const r1=Math.abs(G.ang1-90)<0.5, r2=Math.abs(G.ang2-90)<0.5;
    setLine(O.mk1,cornerPts(on1(B,0.02),on1(G.A,0.02),on1(G.C,0.02),r1?0.28:0.45,r1));
    setLine(O.mk2,cornerPts(on2(B,0.02),on2(G.A,0.02),on2(G.C,0.02),r2?0.28:0.45,r2));
    O.mk1.material.color.set(r1?COL.ok:COL.bad); O.mk2.material.color.set(r2?COL.ok:COL.bad);
    // подпись угла — по биссектрисе
    const bis=(Pa,Pc,Pb)=>{const a=new THREE.Vector3().subVectors(Pa,Pb).normalize(), c=new THREE.Vector3().subVectors(Pc,Pb).normalize(); return Pb.clone().addScaledVector(a.add(c).normalize(),0.95);};
    O.v1.position.copy(bis(on1(G.A,0.03),on1(G.C,0.03),on1(B,0.03))); O.v1.setText(G.ang1.toFixed(0)+'°', r1?COL.ok:COL.bad);
    O.v2.position.copy(bis(on2(G.A,0.03),on2(G.C,0.03),on2(B,0.03))); O.v2.setText(G.ang2.toFixed(0)+'°', r2?COL.ok:COL.bad);
    // проецирующая плоскость BA: на П₁ (mode h) или на П₂ (mode f)
    const prj = mode==='h' ? (p=>V(p.x,p.y,0)) : (p=>V(p.x,0,p.z));
    const q=[W(B),W(G.A),W(prj(G.A)),W(prj(B))];
    setQuad(O.q,q); setLine(O.qe,[...q,q[0]]);
    setLine(O.qm1,cornerPts(W(B),W(G.C),W(prj(B)),0.3,true));      // BC ⟂ проецирующего луча BB₁
    setLine(O.qm2,cornerPts(W(B),W(G.C),W(G.A),0.45,true));          // BC ⟂ BA
    O.ql.position.copy(q[0]).lerp(q[2],0.5);
  }
  function updateFold(fold){
    p1g.rotation.x=fold*deg; p1g.updateMatrixWorld(true);
    const fade=Math.max(0,1-fold/60), t=new THREE.Vector3();
    for(const n in O.pts){ const o=O.pts[n]; o.m1.getWorldPosition(t); setLine(o.L1,[o.w,t]); o.L1.material.opacity=0.6*fade; setLine(o.k1,[o.xa,t]); }
  }

  const TEXT={
    1:'Прямой угол ABC в общем положении: ни одна сторона не параллельна плоскостям проекций. На обеих проекциях угол искажён — может выйти и острым, и тупым. Подвигайте ползунки: в пространстве угол всегда 90°, а на эпюре нет.',
    2:'Наклон BC к П₁ равен 0: сторона BC параллельна П₁ (горизонталь). Теперь на П₁ угол ровно 90°, как бы мы ни поворачивали BA вокруг BC — нажмите «Вращать». На П₂ угол по-прежнему искажается. Это и есть теорема: если одна сторона прямого угла параллельна плоскости проекций, на эту плоскость он проецируется прямым углом.',
    3:'Доказательство. Σ — проецирующая плоскость стороны BA (через BA и луч BB₁ ⟂ П₁). BC ⟂ BA по условию. BC ∥ П₁, значит BC ⟂ BB₁. Прямая, перпендикулярная двум пересекающимся прямым плоскости Σ, перпендикулярна всей Σ. B₁C₁ ∥ BC (BC параллельна П₁), поэтому B₁C₁ ⟂ Σ, а значит и B₁C₁ ⟂ A₁B₁ — ведь A₁B₁ лежит в Σ. Если BC наклонить, BC перестаёт быть ⟂ BB₁ — и доказательство рушится.',
    4:'То же для П₂: BC ∥ П₂ (фронталь) — прямой угол без искажения проецируется на П₂, а на П₁ искажается. Правило: прямой угол сохраняется на той плоскости, которой параллельна хотя бы одна его сторона.',
  };

  const VIEWS={
    iso:{th:0.72,ph:1.12,r:15,t:[0,2.2,2.6],fold:0},
    front:{th:0,ph:Math.PI/2,r:13,t:[0,2.7,0],fold:0},
    top:{th:0,ph:0.001,r:13,t:[0,0,2.8],fold:0},
    epure:{th:0,ph:Math.PI/2,r:19,t:[0,-0.3,0],fold:90},
  };
  const cur={...VIEWS.iso,t:[...VIEWS.iso.t]}, tgt={...VIEWS.iso,t:[...VIEWS.iso.t]};
  function placeCamera(){const s=Math.sin(cur.ph); camera.position.set(cur.t[0]+cur.r*s*Math.sin(cur.th),cur.t[1]+cur.r*Math.cos(cur.ph),cur.t[2]+cur.r*s*Math.cos(cur.th)); camera.up.set(0,1,0); if(cur.ph<0.01) camera.up.set(0,0,-1); camera.lookAt(cur.t[0],cur.t[1],cur.t[2]);}
  const pointers=new Map(); let pinch0=0,r0=0;
  canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY}); if(pointers.size===2){const [a,b]=[...pointers.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);r0=tgt.r;}});
  canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return; const pr=pointers.get(e.pointerId),dx=e.clientX-pr.x,dy=e.clientY-pr.y; pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pointers.size===1){tgt.th-=dx*0.008;tgt.ph=Math.min(Math.PI-0.05,Math.max(0.001,tgt.ph-dy*0.008));cur.th=tgt.th;cur.ph=tgt.ph;markView(null);}
    else if(pointers.size===2&&pinch0>0){const [a,b]=[...pointers.values()];tgt.r=Math.min(40,Math.max(6,r0*pinch0/Math.hypot(a.x-b.x,a.y-b.y)));}});
  const up=e=>{pointers.delete(e.pointerId); if(pointers.size<2)pinch0=0;};
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);
  canvas.addEventListener('wheel',e=>{e.preventDefault();tgt.r=Math.min(40,Math.max(6,tgt.r*(1+Math.sign(e.deltaY)*0.08)));},{passive:false});
  const foldIn=document.getElementById('fold'), foldVal=document.getElementById('foldVal');
  foldIn.addEventListener('input',()=>{tgt.fold=+foldIn.value;foldVal.textContent=foldIn.value+'°';});
  function markView(n){document.querySelectorAll('#views button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===n)));}
  document.querySelectorAll('#views button').forEach(b=>b.addEventListener('click',()=>{const v=VIEWS[b.dataset.view]; tgt.th=v.th;tgt.ph=v.ph;tgt.r=v.r;tgt.t=[...v.t];tgt.fold=v.fold;
    while(cur.th-tgt.th>Math.PI)cur.th-=2*Math.PI; while(tgt.th-cur.th>Math.PI)cur.th+=2*Math.PI; foldIn.value=v.fold;foldVal.textContent=v.fold+'°';markView(b.dataset.view);}));
  function resize(){const st=document.getElementById('stage');renderer.setSize(st.clientWidth,st.clientHeight,false);camera.aspect=st.clientWidth/st.clientHeight;camera.updateProjectionMatrix();}
  new ResizeObserver(resize).observe(document.getElementById('stage'));

  function start(){
    buildPlanes(); buildDynamic();
    const T=id=>document.getElementById(id);
    const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
    // состояние: mode, θ, φ (текущие и целевые — для плавных переходов)
    const st={mode:'h', th:25, thT:25, ph:40, phT:40, play:false, dir:1, step:1};
    const syncUI=()=>{ T('tilt').value=Math.round(st.thT); T('tiltVal').textContent=Math.round(st.thT)+'°';
      T('phi').value=Math.round(st.phT); T('phiVal').textContent=Math.round(st.phT)+'°';
      T('tiltName').textContent = st.mode==='h' ? 'Наклон BC к П₁' : 'Наклон BC к П₂'; };
    const apply=()=>{
      sp3.visible=T('tSpace').checked; why.visible=st.step===3 && T('tSpace').checked;
      document.querySelectorAll('#steps button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===st.step)));
      T('stepText').textContent=TEXT[st.step];
    };
    const PRE={1:{mode:'h',th:25},2:{mode:'h',th:0},3:{mode:'h',th:0},4:{mode:'f',th:0}};
    document.querySelectorAll('#steps button').forEach(b=>b.addEventListener('click',()=>{
      st.step=+b.dataset.step; const p=PRE[st.step];
      if(p.mode!==st.mode){ st.mode=p.mode; st.th=p.th; } st.thT=p.th; if(reduce) st.th=st.thT;
      syncUI(); apply(); }));
    T('tilt').addEventListener('input',()=>{ st.thT=st.th=+T('tilt').value; syncUI(); });
    T('phi').addEventListener('input',()=>{ st.phT=st.ph=+T('phi').value; st.play=false; T('play').setAttribute('aria-pressed','false'); T('play').textContent='▶ Вращать BA вокруг BC'; syncUI(); });
    T('play').addEventListener('click',()=>{ st.play=!st.play; T('play').setAttribute('aria-pressed',String(st.play)); T('play').textContent= st.play ? '⏸ Остановить' : '▶ Вращать BA вокруг BC'; });
    T('tSpace').addEventListener('change',apply);
    syncUI(); apply();
    const mq=matchMedia('(prefers-color-scheme: dark)'); mq.addEventListener&&mq.addEventListener('change',()=>{const c=css('--ink');inkMats.forEach(m=>m.color.set(c));});

    (function frame(){
      const k=reduce?1:0.12;
      cur.th+=(tgt.th-cur.th)*k;cur.ph+=(tgt.ph-cur.ph)*k;cur.r+=(tgt.r-cur.r)*k; for(let i=0;i<3;i++)cur.t[i]+=(tgt.t[i]-cur.t[i])*k; cur.fold+=(tgt.fold-cur.fold)*k;
      if(st.play){ st.phT+=st.dir*0.6; if(st.phT>75){st.phT=75;st.dir=-1;} if(st.phT<-75){st.phT=-75;st.dir=1;} st.ph=st.phT;
        T('phi').value=Math.round(st.phT); T('phiVal').textContent=Math.round(st.phT)+'°'; }
      st.th+=(st.thT-st.th)*k; if(Math.abs(st.thT-st.th)<0.01) st.th=st.thT;
      update(st.mode,st.th,st.ph);
      T('calc').innerHTML=`В пространстве: <b>90°</b> &nbsp;·&nbsp; на П₁: <b style="color:${Math.abs(G.ang1-90)<0.5?COL.ok:COL.bad}">${G.ang1.toFixed(1)}°</b> &nbsp;·&nbsp; на П₂: <b style="color:${Math.abs(G.ang2-90)<0.5?COL.ok:COL.bad}">${G.ang2.toFixed(1)}°</b>`;
      updateFold(cur.fold);
      placeCamera(); renderer.render(scene,camera); requestAnimationFrame(frame);
    })();
    resize();
  }
  const ready=document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve();
  Promise.race([ready,new Promise(r=>setTimeout(r,1500))]).then(start);
})();
</script>
</body>
