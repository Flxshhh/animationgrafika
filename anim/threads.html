<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Резьбовые соединения — 3D, вариант 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e7ecee;
    --stage: #dfe5e8;
    --panel: #f6f8f9;
    --ink: #1c272c;
    --muted: #55656c;
    --line: #1f7fa8;
    --axis: #c8641a;
    --rule: #c3ced3;
    --on: #1f7fa8;
    --on-ink: #ffffff;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #36393b;
      --stage: #424648;
      --panel: #2e3133;
      --ink: #eef3f5;
      --muted: #a9b6bb;
      --line: #5bb7da;
      --axis: #f0893a;
      --rule: #555b5e;
      --on: #5bb7da;
      --on-ink: #10242d;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #36393b;
    --stage: #424648;
    --panel: #2e3133;
    --ink: #eef3f5;
    --muted: #a9b6bb;
    --line: #5bb7da;
    --axis: #f0893a;
    --rule: #555b5e;
    --on: #5bb7da;
    --on-ink: #10242d;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Golos Text", "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.45;
  }
  .wrap {
    max-width: 980px;
    margin: 0 auto;
    padding: 14px 14px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  header h1 {
    font-size: 1.25rem;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 0.9rem; }
  .tabs, .seg { display: flex; gap: 0; border: 1.5px solid var(--line); border-radius: 8px; overflow: hidden; }
  .tabs button, .seg button {
    flex: 1;
    font: inherit;
    font-weight: 500;
    background: transparent;
    color: var(--ink);
    border: 0;
    padding: 9px 8px;
    cursor: pointer;
    min-height: 42px;
  }
  .tabs button + button, .seg button + button { border-left: 1.5px solid var(--line); }
  .tabs button[aria-pressed="true"], .seg button[aria-pressed="true"] { background: var(--on); color: var(--on-ink); }
  button:focus-visible { outline: 3px solid var(--axis); outline-offset: -3px; }
  .stage {
    position: relative;
    background: var(--stage);
    border: 1px solid var(--rule);
    border-radius: 10px;
    height: min(62vh, 560px);
    min-height: 320px;
    overflow: hidden;
    touch-action: none;
  }
  .stage canvas { display: block; width: 100%; height: 100%; }
  .stage .hint {
    position: absolute; left: 10px; bottom: 8px; right: 10px;
    font-size: 0.8rem; color: var(--muted); pointer-events: none;
  }
  .controls { display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .row .seg { flex: 1 1 280px; }
  .toggle {
    font: inherit; font-weight: 500;
    background: transparent; color: var(--ink);
    border: 1.5px solid var(--line); border-radius: 8px;
    padding: 9px 14px; min-height: 42px; cursor: pointer;
  }
  .toggle[aria-pressed="true"] { background: var(--on); color: var(--on-ink); }
  .toggle[hidden] { display: none; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.9rem; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 14px; height: 14px; border-radius: 3px; display: inline-block; border: 1px solid var(--rule); }
  .note {
    background: var(--panel);
    border-left: 3px solid var(--line);
    padding: 10px 12px;
    border-radius: 0 8px 8px 0;
    font-size: 0.92rem;
    max-width: 75ch;
  }
  .note p { margin: 0 0 6px; }
  .note p:last-child { margin-bottom: 0; }
  .err { color: var(--axis); padding: 16px; }
</style>
</head>
<body>
<a class="cat-back" href="../index.html" style="position:fixed;z-index:50;top:calc(8px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));font:600 13px/1 'PT Sans',Arial,sans-serif;padding:7px 10px;border-radius:6px;background:rgba(30,42,56,.86);color:#fff;text-decoration:none">← Каталог</a>
<div class="wrap">
  <header>
    <h1>Изображение резьбовых соединений</h1>
    <p>Вариант 4 · модели для просмотра, пропорции сняты с эскизов</p>
  </header>

  <div class="tabs" role="group" aria-label="Модель">
    <button id="tab-part" aria-pressed="true">Задание 1: деталь</button>
    <button id="tab-asm" aria-pressed="false">Задание 2: линза в оправе</button>
  </div>

  <div class="stage" id="stage">
    <div class="hint">Вращайте одним пальцем, приближайте двумя</div>
  </div>

  <div class="controls">
    <div class="row">
      <div class="seg" role="group" aria-label="Разрез">
        <button data-cut="none" aria-pressed="false">Целиком</button>
        <button data-cut="quarter" aria-pressed="true">Вид + разрез</button>
        <button data-cut="half" aria-pressed="false">Полный разрез</button>
      </div>
      <button class="toggle" id="explode" aria-pressed="false" hidden>Разнести детали</button>
    </div>
    <div class="legend" id="legend"></div>
    <div class="note" id="note"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  const stage = document.getElementById('stage');
  if (!window.THREE || !THREE.OrbitControls) {
    stage.innerHTML = '<div class="err">Не загрузилась библиотека 3D. Проверьте подключение к интернету и обновите страницу.</div>';
    return;
  }

  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  // ---------- renderer / scene ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.localClippingEnabled = true;
  stage.prepend(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 1, 0.5, 2000);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;

  scene.add(new THREE.HemisphereLight(0xffffff, 0x445055, 0.75));
  const key = new THREE.DirectionalLight(0xffffff, 0.75);
  key.position.set(40, 60, 80);
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xffffff, 0.35);
  rim.position.set(-60, -20, -40);
  scene.add(rim);

  // ---------- clipping ----------
  const planeFront = new THREE.Plane(new THREE.Vector3(0, 0, -1), 0); // убирает z > 0
  const planeLower = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);  // убирает y < 0
  const allMats = [];
  function setCut(mode) {
    let planes = [], inter = false;
    if (mode === 'half') planes = [planeFront];
    if (mode === 'quarter') { planes = [planeFront, planeLower]; inter = true; }
    allMats.forEach(m => { m.clippingPlanes = planes; m.clipIntersection = inter; m.needsUpdate = true; });
    document.querySelectorAll('[data-cut]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.cut === mode)));
  }

  // ---------- geometry helpers ----------
  const SEGS = 128;
  // зубья резьбы (кольцевые, без винтовой линии) от a до b по оси
  function zig(a, b, first, second, pitch) {
    const n = Math.max(1, Math.round(Math.abs(b - a) / pitch));
    const st = (b - a) / n, pts = [];
    for (let k = 0; k <= n; k++) {
      const x = a + k * st;
      pts.push([first, x]);
      if (k < n) pts.push([second, x + st / 2]);
    }
    return pts;
  }
  // дублируем вершины профиля, чтобы рёбра были острыми, а не сглаженными
  function sharp(pts) {
    const out = [];
    pts.forEach(p => {
      const last = out[out.length - 1];
      if (last && Math.abs(last[0] - p[0]) < 1e-6 && Math.abs(last[1] - p[1]) < 1e-6) return;
      out.push(p, p);
    });
    return out;
  }
  function lathe(pts) {
    return new THREE.LatheGeometry(pts.map(p => new THREE.Vector2(p[0], p[1])), SEGS);
  }

  const edgeMats = [];
  function solid(geo, color, capColor, opts = {}) {
    const g = new THREE.Group();
    const front = new THREE.MeshStandardMaterial({
      color, metalness: opts.metal ?? 0.35, roughness: opts.rough ?? 0.45,
      transparent: !!opts.opacity, opacity: opts.opacity ?? 1, side: THREE.FrontSide
    });
    const back = new THREE.MeshBasicMaterial({
      color: capColor, side: THREE.BackSide,
      transparent: !!opts.opacity, opacity: opts.opacity ? Math.min(1, opts.opacity + 0.25) : 1
    });
    const edge = new THREE.LineBasicMaterial({ color: css('--line') });
    allMats.push(front, back, edge);
    edgeMats.push(edge);
    g.add(new THREE.Mesh(geo, back));
    g.add(new THREE.Mesh(geo, front));
    g.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 25), edge));
    return g;
  }

  // ось: по умолчанию Lathe крутит вокруг Y, поворачиваем группу так, чтобы ось стала горизонтальной (X)
  function axisGroup() { const g = new THREE.Group(); g.rotation.z = -Math.PI / 2; return g; }

  const axisMats = [];
  function axisLine(len) {
    const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-len / 2, 0, 0), new THREE.Vector3(len / 2, 0, 0)]);
    const m = new THREE.LineDashedMaterial({ color: css('--axis'), dashSize: 3, gapSize: 1.2 });
    axisMats.push(m);
    const l = new THREE.Line(geo, m);
    l.computeLineDistances();
    return l;
  }

  // ================= ЗАДАНИЕ 1: деталь =================
  // Единицы — пиксели эскиза / 10. Ось X — ось детали, 0 = левый торец.
  function buildPart() {
    const root = new THREE.Group();
    const g = axisGroup();
    const C = 0x9eabb2, CAP = 0x5e7a88, P = 1.2;

    // шестигранник 0…12.35, R по вершинам 12.8, отверстие по наружному диаметру резьбы
    const hex = new THREE.Shape();
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3;
      const x = 12.8 * Math.cos(a), y = 12.8 * Math.sin(a);
      i ? hex.lineTo(x, y) : hex.moveTo(x, y);
    }
    const hole = new THREE.Path();
    hole.absarc(0, 0, 8.85, 0, Math.PI * 2, true);
    hex.holes.push(hole);
    const hexGeo = new THREE.ExtrudeGeometry(hex, { depth: 12.35, bevelEnabled: false, curveSegments: 64 });
    const hexMesh = solid(hexGeo, C, CAP);
    hexMesh.rotation.x = -Math.PI / 2;   // выдавливание по Z -> вдоль оси Y
    g.add(hexMesh);

    // витки внутренней резьбы внутри шестигранника
    const ridge = sharp([[8.85, 0], [8.85, 12.35], ...zig(12.35, 0, 8.7, 7.35, P)]);
    g.add(solid(lathe(ridge), C, CAP));

    // тело вращения: буртик, конус, участок с наружной резьбой, цилиндр
    const outer = [
      [17.65, 12.35], [17.65, 24.05],          // буртик
      [13.3, 24.05], [11.05, 37.15],           // конус
      [8.9, 37.15],
      ...zig(37.15, 46.05, 8.9, 7.35, P),      // наружная резьба
      [8.9, 63.65]                             // гладкий цилиндр
    ];
    const inner = [
      [5.8, 63.65], [5.8, 51.15],              // расточка справа
      [4.0, 51.15], [4.0, 17.85],              // сквозной канал
      [8.7, 17.85],
      ...zig(17.85, 12.35, 8.7, 7.35, P)       // продолжение внутренней резьбы
    ];
    const prof = sharp([...outer, ...inner, outer[0]]);
    g.add(solid(lathe(prof), C, CAP));

    g.position.x = -31.8;
    root.add(g);
    root.add(axisLine(84));
    return { root, view: { pos: [38, 22, 78], target: [0, 0, 0] } };
  }

  // ================= ЗАДАНИЕ 2: сборка =================
  function buildAsm() {
    const root = new THREE.Group();
    const OFF = -81.5, P = 0.8;
    const parts = {};

    // Оправа
    {
      const g = axisGroup();
      const outer = [
        [16.8, 70.0], [17.9, 71.2],
        ...zig(71.2, 81.5, 17.9, 16.8, P),     // наружная резьба на хвостовике
        [16.2, 81.5], [16.2, 83.0],            // проточка
        [22.4, 83.0], [22.4, 100.0]
      ];
      const inner = [
        [14.1, 100.0], [14.1, 77.1],
        [15.0, 75.7], [15.4, 75.7], [15.4, 70.0] // расточка под линзу и уступ
      ];
      g.add(solid(lathe(sharp([...outer, ...inner, outer[0]])), 0x93a2aa, 0x4f6f80));
      g.position.x = OFF;
      root.add(g);
      parts.opr = g;
    }

    // Линза
    {
      const g = axisGroup();
      const L0 = 66.9, R1 = 69.7, R2 = 75.7, L1 = 78.4, RAD = 15.4;
      const rl = (RAD * RAD + (R1 - L0) ** 2) / (2 * (R1 - L0));
      const rr = (RAD * RAD + (L1 - R2) ** 2) / (2 * (L1 - R2));
      const pts = [];
      const N = 40;
      for (let i = 0; i <= N; i++) { const r = RAD * i / N; pts.push([r, L0 + (rl - Math.sqrt(rl * rl - r * r))]); }
      pts.push([RAD, R2]);
      for (let i = N; i >= 0; i--) { const r = RAD * i / N; pts.push([r, L1 - (rr - Math.sqrt(rr * rr - r * r))]); }
      // острые кромки только на ободке
      const p2 = [];
      pts.forEach((p, i) => { p2.push(p); if (i === N || i === N + 1) p2.push(p); });
      g.add(solid(lathe(p2), 0x9fd6ea, 0x7cc3dc, { opacity: 0.55, metal: 0.0, rough: 0.1 }));
      g.position.x = OFF;
      root.add(g);
      parts.lens = g;
    }

    // Кольцо резьбовое (сдвинуто до упора бортика в линзу)
    {
      const g = axisGroup();
      const S = 53;
      const outer = [
        [14.1, 10.0 + S], [21.4, 10.0 + S], [22.4, 11.0 + S],
        [22.4, 26.0 + S], [21.4, 27.0 + S]
      ];
      const inner = [
        ...zig(27.0 + S, 18.5 + S, 17.9, 16.8, P), // внутренняя резьба
        [19.7, 18.5 + S], [19.7, 16.7 + S],          // канавка
        [15.0, 16.7 + S], [14.1, 15.7 + S]           // бортик, прижимающий линзу
      ];
      g.add(solid(lathe(sharp([...outer, ...inner, outer[0]])), 0xbfa577, 0x8a6a35, { metal: 0.45 }));
      g.position.x = OFF;
      root.add(g);
      parts.ring = g;
    }

    root.add(axisLine(70));
    return { root, parts, view: { pos: [30, 20, 72], target: [0, 0, 0] } };
  }

  const part = buildPart();
  const asm = buildAsm();
  scene.add(part.root, asm.root);

  // ---------- разнесение ----------
  let explodeOn = false, ex = 0;
  const base = { ring: asm.parts.ring.position.x, lens: asm.parts.lens.position.x };
  function applyExplode(t) {
    asm.parts.ring.position.x = base.ring - 26 * t;
    asm.parts.lens.position.x = base.lens - 12 * t;
  }

  // ---------- UI ----------
  const legend = document.getElementById('legend');
  const note = document.getElementById('note');
  const explodeBtn = document.getElementById('explode');
  const tabPart = document.getElementById('tab-part');
  const tabAsm = document.getElementById('tab-asm');

  function show(which) {
    const isPart = which === 'part';
    part.root.visible = isPart;
    asm.root.visible = !isPart;
    tabPart.setAttribute('aria-pressed', String(isPart));
    tabAsm.setAttribute('aria-pressed', String(!isPart));
    explodeBtn.hidden = isPart;
    const v = (isPart ? part : asm).view;
    camera.position.set(...v.pos);
    controls.target.set(...v.target);
    controls.update();
    setCut(isPart ? 'quarter' : 'half');
    if (isPart) {
      legend.innerHTML = '<span><i style="background:#9eabb2"></i>Деталь</span><span><i style="background:#5e7a88"></i>Плоскость разреза</span>';
      note.innerHTML =
        '<p>«Вид + разрез» вырезает нижнюю переднюю четверть: сверху от оси остаётся вид, снизу виден разрез, как требует задание.</p>' +
        '<p>Слева шестигранник с внутренней резьбой, дальше буртик, конус, участок с наружной резьбой и гладкий цилиндр. Внутри сквозной канал и расточка справа.</p>';
    } else {
      legend.innerHTML = '<span><i style="background:#93a2aa"></i>Оправа</span><span><i style="background:#bfa577"></i>Кольцо резьбовое</span><span><i style="background:#9fd6ea"></i>Линза</span>';
      note.innerHTML =
        '<p>Линза сидит в расточке оправы и упирается в уступ. Кольцо навинчивается внутренней резьбой на наружную резьбу хвостовика и бортиком прижимает линзу.</p>' +
        '<p>Посмотрите на полный разрез: на участке свинчивания витки оправы входят в витки кольца. Поэтому на чертеже здесь рисуют резьбу оправы, ведь наружная резьба у неё.</p>';
    }
  }

  tabPart.addEventListener('click', () => show('part'));
  tabAsm.addEventListener('click', () => show('asm'));
  document.querySelectorAll('[data-cut]').forEach(b => b.addEventListener('click', () => setCut(b.dataset.cut)));
  explodeBtn.addEventListener('click', () => {
    explodeOn = !explodeOn;
    explodeBtn.setAttribute('aria-pressed', String(explodeOn));
  });

  // смена светлой/тёмной темы
  function recolor() {
    edgeMats.forEach(m => m.color.set(css('--line')));
    axisMats.forEach(m => m.color.set(css('--axis')));
  }
  if (window.matchMedia) {
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    (mq.addEventListener ? mq.addEventListener('change', recolor) : mq.addListener(recolor));
  }
  new MutationObserver(recolor).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  // ---------- размер и цикл ----------
  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage);
  resize();

  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function loop() {
    const target = explodeOn ? 1 : 0;
    if (Math.abs(ex - target) > 1e-3) {
      ex = reduce ? target : ex + (target - ex) * 0.12;
      applyExplode(ex);
    }
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }

  show('part');
  loop();
})();
</script>
</body>
</html>
