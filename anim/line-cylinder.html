<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Пересечение прямой с цилиндром</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=PT+Sans+Narrow:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E9EDF1; --panel:#F7F9FB; --ink:#1E2A38; --muted:#5A6878; --rule:#C9D2DB;
  --p2:#3B7BC4; --p1:#3E9A64;
  color-scheme: light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#141B23; --panel:#1C2530; --ink:#DCE4EC; --muted:#93A1B0; --rule:#334150; --p2:#6AA3E3; --p1:#62BF88; color-scheme: dark; }
}
:root[data-theme="dark"]{ --paper:#141B23; --panel:#1C2530; --ink:#DCE4EC; --muted:#93A1B0; --rule:#334150; --p2:#6AA3E3; --p1:#62BF88; color-scheme: dark; }
*{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:"PT Sans","Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{padding:12px 16px 4px}
h1{font-family:"PT Sans Narrow","PT Sans",Arial,sans-serif;font-weight:700;font-size:1.35rem;margin:0;letter-spacing:.01em}
header p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
#stage{position:relative;flex:1;min-height:200px}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.hint{position:absolute;left:16px;top:6px;font-size:.8rem;color:var(--muted);pointer-events:none}
.panel{background:var(--panel);border-top:1px solid var(--rule);padding:12px 16px 14px;max-height:48vh;overflow:auto}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
button{font:inherit;font-size:.92rem;color:var(--ink);background:transparent;border:1px solid var(--rule);border-radius:6px;padding:6px 12px;cursor:pointer}
button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--panel)}
button:focus-visible,input:focus-visible{outline:2px solid var(--p2);outline-offset:2px}
.steps button{border-style:dashed}
.steps button[aria-pressed="true"]{border-style:solid}
.fold{display:flex;align-items:center;gap:10px;width:100%}
.fold label{font-size:.92rem;white-space:nowrap}
.fold input{flex:1;accent-color:var(--p1)}
.toggles label{font-size:.9rem;display:flex;gap:6px;align-items:center}
#stepText{font-size:.92rem;line-height:1.5;max-width:70ch;margin:0;border-left:3px solid var(--p2);padding-left:10px}
</style>
</head>
<body>
<a class="cat-back" href="../index.html" style="position:fixed;z-index:50;top:calc(8px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));font:600 13px/1 'PT Sans',Arial,sans-serif;padding:7px 10px;border-radius:6px;background:rgba(30,42,56,.86);color:#fff;text-decoration:none">← Каталог</a>
<header>
  <h1>Пересечение прямой a с цилиндром</h1>
  <p>Цилиндр ⊥ П₁ — поверхность проецирующая, вспомогательная плоскость не нужна</p>
</header>
<div id="stage">
  <canvas id="c"></canvas>
  <div class="hint">Вращайте пальцем или мышью, масштаб — колесом или щипком</div>
</div>
<div class="panel">
  <div class="row steps" id="steps">
    <button data-step="1" aria-pressed="false">1. Окружность на П₁</button>
    <button data-step="2" aria-pressed="false">2. A₁, B₁</button>
    <button data-step="3" aria-pressed="false">3. A₂, B₂</button>
    <button data-step="4" aria-pressed="true">4. Видимость</button>
  </div>
  <p id="stepText"></p>
  <div class="row" id="views" style="margin-top:10px">
    <button data-view="iso" aria-pressed="true">Пространство</button>
    <button data-view="front" aria-pressed="false">Вид на П₂</button>
    <button data-view="top" aria-pressed="false">Вид на П₁</button>
    <button data-view="epure" aria-pressed="false">Эпюр</button>
  </div>
  <div class="row fold">
    <label for="fold">Поворот П₁: <span id="foldVal">0°</span></label>
    <input id="fold" type="range" min="0" max="90" value="0">
  </div>
  <div class="row toggles">
    <label><input type="checkbox" id="tSpace" checked> Объекты в пространстве</label>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  // ---------- исходные данные (Монж: x; y — к наблюдателю; z — вверх) ----------
  const V=(x,y,z)=>({x,y,z});
  const add=(a,b)=>V(a.x+b.x,a.y+b.y,a.z+b.z), sub=(a,b)=>V(a.x-b.x,a.y-b.y,a.z-b.z), mul=(a,k)=>V(a.x*k,a.y*k,a.z*k);
  // цилиндр: ось ⊥ П₁ (x = 0, y = yO), основания z = zb и z = zt
  const R=1.5, yO=2.8, zb=0.5, zt=4.6;
  // A — на передней половине, B — почти на правой очерковой образующей (как на доске)
  const A=V(-0.6*R, yO+0.8*R, 3.04);
  const bA=-3*Math.PI/180;
  const B=V(R*Math.cos(bA), yO-R*Math.sin(bA), 4.4);
  const dAB=sub(B,A), P=sub(A,mul(dAB,0.5)), Q=add(B,mul(dAB,0.4)), d=sub(Q,P);
  const at=s=>add(P,mul(d,s));
  const sA=0.5/1.9, sB=1.5/1.9;   // параметры A и B на отрезке PQ

  // видимость: П₂ — смотрим вдоль −y (видна точка с большим y), П₁ — сверху (видна точка с большим z)
  function hidden(view,p){
    const inX = Math.abs(p.x)<R, inZ = p.z>=zb && p.z<=zt;
    if(view==='p2') return inX && inZ && p.y < yO+Math.sqrt(R*R-p.x*p.x);
    const inC = p.x*p.x+(p.y-yO)*(p.y-yO) < R*R;
    return inC && p.z < zt;
  }
  function runs(view){
    const N=800, out=[]; let cur=null;
    for(let i=0;i<=N;i++){
      const s=i/N, st=(s>sA && s<sB)?'in':(hidden(view,at(s))?'hid':'vis');
      if(!cur||cur.st!==st){ if(cur){cur.b=s;out.push(cur);} cur={st,a:s}; }
    }
    cur.b=1; out.push(cur); return out;
  }

  const PLANE_V=5.6, PLANE_H=6.0, HALF_X=3.6, deg=Math.PI/180;
  const W=p=>new THREE.Vector3(p.x,p.z,p.y);
  const on2=(p,e=0.02)=>new THREE.Vector3(p.x,p.z,e);
  const on1=(p,e=0.02)=>new THREE.Vector3(p.x,e,p.y);
  const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  const canvas=document.getElementById('c');
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  const scene=new THREE.Scene();
  const camera=new THREE.PerspectiveCamera(38,1,0.1,200);
  scene.add(new THREE.AmbientLight(0xffffff,0.7));
  const dl=new THREE.DirectionalLight(0xffffff,0.5); dl.position.set(5,10,8); scene.add(dl);

  const inkMats=[];
  function lineMat(color,dashed,opacity=1,isInk=false){
    const m=dashed?new THREE.LineDashedMaterial({color,dashSize:0.13,gapSize:0.09,transparent:true,opacity}):new THREE.LineBasicMaterial({color,transparent:true,opacity});
    if(isInk) inkMats.push(m); return m;
  }
  function poly(points,mat){const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(points),mat); if(mat.isLineDashedMaterial) l.computeLineDistances(); return l;}
  const seg=(a,b,mat)=>poly([a.clone(),b.clone()],mat);
  function setSeg(l,a,b){const p=l.geometry.attributes.position;p.setXYZ(0,a.x,a.y,a.z);p.setXYZ(1,b.x,b.y,b.z);p.needsUpdate=true;l.geometry.computeBoundingSphere(); if(l.material.isLineDashedMaterial) l.computeLineDistances();}
  function circle(c,rad,mat){const pts=[];for(let i=0;i<=128;i++){const t=i/128*Math.PI*2;pts.push(new THREE.Vector3(c.x+Math.cos(t)*rad,c.y,c.z+Math.sin(t)*rad));}return poly(pts,mat);}
  function tube(a,b,color,rad=0.03){
    const dir=new THREE.Vector3().subVectors(b,a), len=dir.length();
    const m=new THREE.Mesh(new THREE.CylinderGeometry(rad,rad,len,10),new THREE.MeshBasicMaterial({color}));
    m.position.copy(a).addScaledVector(dir,0.5); m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize()); return m;
  }
  const dot=(color,size=0.075)=>new THREE.Mesh(new THREE.SphereGeometry(size,16,12),new THREE.MeshBasicMaterial({color}));
  function label(text,color,scale=0.5){
    const c=document.createElement('canvas'); c.width=256; c.height=128;
    const g=c.getContext('2d'); g.font='700 76px "PT Sans", Arial, sans-serif'; g.fillStyle=color; g.textAlign='center'; g.textBaseline='middle'; g.fillText(text,128,66);
    const tex=new THREE.CanvasTexture(c); tex.minFilter=THREE.LinearFilter;
    const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthTest:false,transparent:true})); s.scale.set(scale*2,scale,1); s.renderOrder=20; return s;
  }

  function build(){
    const INK=css('--ink'), P1C=css('--p1'), P2C=css('--p2');
    const COL={T:'#5C7A99',L:'#D2484F',G:'#C08A1A',K:'#D2484F'};
    const p2g=new THREE.Group(); scene.add(p2g);
    const p1g=new THREE.Group(); scene.add(p1g);
    const mkSet=()=>{const s={s:new THREE.Group(),p1:new THREE.Group(),p2:new THREE.Group(),k:new THREE.Group()}; scene.add(s.s); p1g.add(s.p1); p2g.add(s.p2); scene.add(s.k); return s;};
    const sets={base:mkSet(),s1:mkSet(),s2:mkSet(),s3:mkSet(),lFull:mkSet(),lVis:mkSet()};

    // плоскости проекций
    const p2=new THREE.Mesh(new THREE.PlaneGeometry(HALF_X*2,PLANE_V),new THREE.MeshBasicMaterial({color:P2C,transparent:true,opacity:0.08,side:THREE.DoubleSide,depthWrite:false}));
    p2.position.set(0,PLANE_V/2,0); p2g.add(p2);
    const e2=new THREE.LineSegments(new THREE.EdgesGeometry(p2.geometry),lineMat(P2C,false,0.6)); e2.position.copy(p2.position); p2g.add(e2);
    const l2=label('Π₂',P2C,0.55); l2.position.set(-HALF_X+0.45,PLANE_V-0.35,0.02); p2g.add(l2);
    const p1=new THREE.Mesh(new THREE.PlaneGeometry(HALF_X*2,PLANE_H),new THREE.MeshBasicMaterial({color:P1C,transparent:true,opacity:0.08,side:THREE.DoubleSide,depthWrite:false}));
    p1.rotation.x=-Math.PI/2; p1.position.set(0,0,PLANE_H/2); p1g.add(p1);
    const e1=new THREE.LineSegments(new THREE.EdgesGeometry(p1.geometry),lineMat(P1C,false,0.6)); e1.rotation.copy(p1.rotation); e1.position.copy(p1.position); p1g.add(e1);
    const l1=label('Π₁',P1C,0.55); l1.position.set(-HALF_X+0.45,0.02,PLANE_H-0.35); p1g.add(l1);
    scene.add(seg(new THREE.Vector3(-HALF_X,0,0),new THREE.Vector3(HALF_X,0,0),lineMat(INK,false,1,true)));
    const lx=label('x',INK,0.45); lx.position.set(HALF_X+0.3,0,0); scene.add(lx);

    // цилиндр
    const b=sets.base;
    const cyl=new THREE.Mesh(new THREE.CylinderGeometry(R,R,zt-zb,64,1,false),
      new THREE.MeshPhongMaterial({color:0x9fb3c8,transparent:true,opacity:0.26,side:THREE.DoubleSide,depthWrite:false,shininess:30}));
    cyl.position.copy(W(V(0,yO,(zb+zt)/2))); b.s.add(cyl);
    b.s.add(circle(W(V(0,yO,zb)),R,lineMat(COL.T,false,1)));
    b.s.add(circle(W(V(0,yO,zt)),R,lineMat(COL.T,false,1)));
    b.s.add(seg(W(V(-R,yO,zb)),W(V(-R,yO,zt)),lineMat(P2C,true,0.9)));   // очерковые образующие → контур на П₂
    b.s.add(seg(W(V( R,yO,zb)),W(V( R,yO,zt)),lineMat(P2C,true,0.9)));
    // П₂: прямоугольник и ось
    b.p2.add(poly([V(-R,0,zb),V(R,0,zb),V(R,0,zt),V(-R,0,zt),V(-R,0,zb)].map(p=>on2(p,0.008)),lineMat(INK,false,1,true)));
    b.p2.add(seg(on2(V(0,0,zb-0.3),0.008),on2(V(0,0,zt+0.3),0.008),lineMat(INK,true,0.55,true)));
    // П₁: окружность и центровые
    b.p1.add(circle(new THREE.Vector3(0,0.008,yO),R,lineMat(INK,false,1,true)));
    b.p1.add(seg(new THREE.Vector3(-R-0.4,0.008,yO),new THREE.Vector3(R+0.4,0.008,yO),lineMat(INK,true,0.55,true)));
    b.p1.add(seg(new THREE.Vector3(0,0.008,yO-R-0.4),new THREE.Vector3(0,0.008,yO+R+0.4),lineMat(INK,true,0.55,true)));

    // прямая a: снаружи — толстая, внутри тела — тонкий штрих
    b.s.add(tube(W(P),W(A),COL.L)); b.s.add(tube(W(B),W(Q),COL.L));
    b.s.add(seg(W(A),W(B),lineMat(COL.L,true,0.7)));
    const la=label('a',COL.L,0.5); la.position.copy(W(P)).add(new THREE.Vector3(-0.25,0.2,0)); b.s.add(la);

    sets.lFull.p2.add(seg(on2(P,0.012),on2(Q,0.012),lineMat(COL.L,false,1)));
    sets.lFull.p1.add(seg(on1(P,0.012),on1(Q,0.012),lineMat(COL.L,false,1)));
    [['p2',on2],['p1',on1]].forEach(([pr,fn])=>{
      runs(pr).forEach(r=>{ if(r.st==='in') return;
        sets.lVis[pr].add(seg(fn(at(r.a),0.012),fn(at(r.b),0.012),lineMat(COL.L,r.st==='hid',1))); });
    });
    [['p2',on2,'a₂'],['p1',on1,'a₁']].forEach(([pr,fn,t])=>{
      const lb=label(t,COL.L,0.42); lb.position.copy(fn(P,0.03)).add(pr==='p2'?new THREE.Vector3(-0.3,-0.2,0):new THREE.Vector3(-0.35,0,0.1));
      sets.lFull[pr].add(lb); sets.lVis[pr].add(lb.clone());
    });

    // шаг 1: вырожденная проекция боковой поверхности — окружность (собирательное свойство)
    sets.s1.p1.add(circle(new THREE.Vector3(0,0.014,yO),R,lineMat(COL.G,false,1)));
    for(let k=0;k<3;k++) sets.s1.p1.add(circle(new THREE.Vector3(0,0.014,yO),R+0.012*(k+1),lineMat(COL.G,false,1)));
    const lc=label('собирательная',COL.G,0.32); lc.position.set(0,0.03,yO+R+0.65); sets.s1.p1.add(lc);
    // в пространстве — проецирующие линии образующих
    for(let k=0;k<12;k++){const t=k/12*Math.PI*2; const q=V(R*Math.cos(t),yO+R*Math.sin(t),zb);
      sets.s1.s.add(seg(W(q),W(V(q.x,q.y,0)),lineMat(COL.G,true,0.6)));}

    // точки A, B: 3D-точка и П₁ — шаг 2, П₂ и линии связи — шаг 3
    const pts=[
      {n:'A',s2:'A₂',s1:'A₁',c:COL.K,p:A,o2:[-0.25,0.3],o1:[-0.15,0.32]},
      {n:'B',s2:'B₂',s1:'B₁',c:COL.K,p:B,o2:[0.3,0.28],o1:[0.38,-0.22]},
    ];
    pts.forEach(o=>{
      const st1=sets.s2, st2=sets.s3; o.w=W(o.p);
      const m=dot(o.c,0.11); m.position.copy(o.w); st1.s.add(m);
      const lb=label(o.n,o.c); lb.position.copy(o.w).add(new THREE.Vector3(0.3,0.25,0)); st1.s.add(lb);
      o.m1=dot(o.c,0.09); o.m1.position.copy(on1(o.p,0.025)); st1.p1.add(o.m1);
      const lb1=label(o.s1,o.c,0.4); lb1.position.copy(on1(o.p,0.03)).add(new THREE.Vector3(o.o1[0],0,-o.o1[1])); st1.p1.add(lb1);
      o.L1=seg(o.w,o.w,lineMat(P1C,true,0.6)); st1.s.add(o.L1);
      o.w2=on2(o.p,0.025); const m2=dot(o.c,0.09); m2.position.copy(o.w2); st2.p2.add(m2);
      const lb2=label(o.s2,o.c,0.4); lb2.position.copy(o.w2).add(new THREE.Vector3(o.o2[0],o.o2[1],0)); st2.p2.add(lb2);
      o.xa=new THREE.Vector3(o.p.x,0,0);
      o.L2=seg(o.w,o.w2,lineMat(P2C,true,0.6)); st2.s.add(o.L2);
      o.Lk2=seg(o.w2,o.xa,lineMat(INK,false,0.45,true)); st2.k.add(o.Lk2);
      o.Lk1=seg(o.xa,o.xa,lineMat(INK,false,0.45,true)); st2.k.add(o.Lk1);
    });
    return {p1g,sets,pts};
  }

  const TEXT={
    1:'Ось цилиндра ⊥ П₁, поэтому вся боковая поверхность проецируется на П₁ в окружность — это вырожденная («собирательная») проекция. Любая точка боковой поверхности на П₁ обязательно лежит на этой окружности. Поэтому вспомогательная плоскость здесь не нужна.',
    2:'Горизонтальные проекции точек пересечения находим сразу: A₁ и B₁ = a₁ ∩ окружность. Задача на П₁ уже решена.',
    3:'По линиям связи поднимаем A₁ и B₁ на фронтальную проекцию прямой: A₂ и B₂ лежат на a₂. Это стрелки на доске: от A₁ вверх, от B₂ вниз.',
    4:'Видимость. Участок AB внутри цилиндра не изображают. На П₁ прямая вне окружности видна целиком. На П₂: A₁ ниже горизонтальной оси окружности — A на передней половине, A₂ видима, и участок a₂ слева от A₂ (внутри контура) лежит перед цилиндром — видим. B₁ практически на горизонтальной оси, то есть B на очерковой образующей — граница видимости, правее неё прямая выходит за контур и видна.',
  };

  const VIEWS={
    iso:{th:0.72,ph:1.12,r:16,t:[0,2.2,2.6],fold:0},
    front:{th:0,ph:Math.PI/2,r:14,t:[0,2.7,0],fold:0},
    top:{th:0,ph:0.001,r:14,t:[0,0,3.0],fold:0},
    epure:{th:0,ph:Math.PI/2,r:19,t:[0,-0.3,0],fold:90},
  };
  const cur={...VIEWS.iso,t:[...VIEWS.iso.t]}, tgt={...VIEWS.iso,t:[...VIEWS.iso.t]};
  function placeCamera(){const s=Math.sin(cur.ph); camera.position.set(cur.t[0]+cur.r*s*Math.sin(cur.th),cur.t[1]+cur.r*Math.cos(cur.ph),cur.t[2]+cur.r*s*Math.cos(cur.th)); camera.up.set(0,1,0); if(cur.ph<0.01) camera.up.set(0,0,-1); camera.lookAt(cur.t[0],cur.t[1],cur.t[2]);}
  const pointers=new Map(); let pinch0=0,r0=0;
  canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY}); if(pointers.size===2){const [a,b]=[...pointers.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);r0=tgt.r;}});
  canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return; const pr=pointers.get(e.pointerId),dx=e.clientX-pr.x,dy=e.clientY-pr.y; pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pointers.size===1){tgt.th-=dx*0.008;tgt.ph=Math.min(Math.PI-0.05,Math.max(0.001,tgt.ph-dy*0.008));cur.th=tgt.th;cur.ph=tgt.ph;markView(null);}
    else if(pointers.size===2&&pinch0>0){const [a,b]=[...pointers.values()];tgt.r=Math.min(40,Math.max(6,r0*pinch0/Math.hypot(a.x-b.x,a.y-b.y)));}});
  const up=e=>{pointers.delete(e.pointerId); if(pointers.size<2)pinch0=0;};
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);
  canvas.addEventListener('wheel',e=>{e.preventDefault();tgt.r=Math.min(40,Math.max(6,tgt.r*(1+Math.sign(e.deltaY)*0.08)));},{passive:false});
  const foldIn=document.getElementById('fold'), foldVal=document.getElementById('foldVal');
  foldIn.addEventListener('input',()=>{tgt.fold=+foldIn.value;foldVal.textContent=foldIn.value+'°';});
  function markView(n){document.querySelectorAll('#views button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===n)));}
  document.querySelectorAll('#views button').forEach(b=>b.addEventListener('click',()=>{const v=VIEWS[b.dataset.view]; tgt.th=v.th;tgt.ph=v.ph;tgt.r=v.r;tgt.t=[...v.t];tgt.fold=v.fold;
    while(cur.th-tgt.th>Math.PI)cur.th-=2*Math.PI; while(tgt.th-cur.th>Math.PI)cur.th+=2*Math.PI; foldIn.value=v.fold;foldVal.textContent=v.fold+'°';markView(b.dataset.view);}));
  function resize(){const st=document.getElementById('stage');renderer.setSize(st.clientWidth,st.clientHeight,false);camera.aspect=st.clientWidth/st.clientHeight;camera.updateProjectionMatrix();}
  new ResizeObserver(resize).observe(document.getElementById('stage'));

  function start(){
    const M=build(); let step=4;
    const tSpace=document.getElementById('tSpace');
    const apply=()=>{
      const sp=tSpace.checked;
      const on={base:true,s1:step===1,s2:step>=2,s3:step>=3,lFull:step<4,lVis:step>=4};
      for(const k in M.sets){const s=M.sets[k]; s.s.visible=on[k]&&sp; s.p1.visible=s.p2.visible=s.k.visible=on[k];}
      document.querySelectorAll('#steps button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.step===step)));
      document.getElementById('stepText').textContent=TEXT[step];
    };
    document.querySelectorAll('#steps button').forEach(b=>b.addEventListener('click',()=>{step=+b.dataset.step;apply();}));
    tSpace.addEventListener('change',apply); apply();
    const mq=matchMedia('(prefers-color-scheme: dark)'); mq.addEventListener&&mq.addEventListener('change',()=>{const c=css('--ink');inkMats.forEach(m=>m.color.set(c));});
    const tmp=new THREE.Vector3(), reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
    (function frame(){
      const k=reduce?1:0.12;
      cur.th+=(tgt.th-cur.th)*k;cur.ph+=(tgt.ph-cur.ph)*k;cur.r+=(tgt.r-cur.r)*k; for(let i=0;i<3;i++)cur.t[i]+=(tgt.t[i]-cur.t[i])*k; cur.fold+=(tgt.fold-cur.fold)*k;
      M.p1g.rotation.x=cur.fold*deg; M.p1g.updateMatrixWorld(true);
      const fade=Math.max(0,1-cur.fold/60);
      M.pts.forEach(o=>{o.m1.getWorldPosition(tmp);setSeg(o.L1,o.w,tmp);o.L1.material.opacity=0.6*fade;setSeg(o.Lk1,o.xa,tmp);});
      placeCamera();renderer.render(scene,camera);requestAnimationFrame(frame);
    })();
    resize();
  }
  const ready=document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve();
  Promise.race([ready,new Promise(r=>setTimeout(r,1500))]).then(start);
})();
</script>
